# Crossway LE City 12M shortened by one window bay between the axles in all
# 8 directions. Paint follows the 2024 photos of this bus: white roof, black
# window band, thin yellow/grey dash strip under the windows, white lower body
# (the yellow roof + dashed skirt of the town scheme is on the Scanias only).

