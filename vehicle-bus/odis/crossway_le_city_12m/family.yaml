# Iveco Crossway LE CITY 12M NP (CNG, Natural Power; engine_type diesel, no
# smoke; 2017-2019), doors 2-2-0, the long flat CNG fairing. Transdev Slezsko
# 56: 32-1001 to 1007, 33-1001 to 1026 (Frýdek-Místek), 51-1001 to 1014
# (Orlovsko), 52-1001 to 1009 (Karvinsko). 3ČSAD white-green (Transdev Slezsko,
# the colours of ex ČSAD Havířov / Karviná / Frýdek-Místek; seznam-autobusu
# "3ČSAD, bílo-zelená & logo dopravy Moravskoslezského kraje"): white, black
# window band, green skirt with a dark pinstripe, green lower front and rear,
# the kraj ring in greens. On this body the green reaches two thirds of the
# lower side and rises to the windows behind the front door. Z-Group bus 11
# (2018): Z-Group bus (ex ČSAD Vsetín; Kopřivnice, Opava and Vítkov depots):
# white, black window band, the kraj ring in its own colours (grey, the red and
# blue inner bands), navy fleet numbers.
# Sprite: original box-model render (vojtechzicha): OCrosswayLECity of
