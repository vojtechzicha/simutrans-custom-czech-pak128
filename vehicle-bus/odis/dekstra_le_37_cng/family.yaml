# Dekstra LE 37 L CNG (CNG; engine_type diesel, no smoke), the Iveco Daily based
# low-entry midibus with a low CNG box on the roof. Transdev Slezsko 7
# (2018-2020): 33-4001 to 4003 (Frýdek-Místek), 52-3001 to 3004 (Karvinsko).
# 3ČSAD white-green (Transdev Slezsko, the colours of ex ČSAD Havířov / Karviná
# / Frýdek-Místek; seznam-autobusu "3ČSAD, bílo-zelená & logo dopravy
# Moravskoslezského kraje"): white, black window band, green skirt with a dark
# pinstripe, green lower front and rear, the kraj ring in greens. Here the lower
# third is green.
# Sprite: VTPsim's Dekstra LE 37 (the IREDO white sheet, vehicle-
# bus/iredo/dekstra_le_37) repainted by odis_town.repaint, the green
# skirt, the CNG box and the kraj ring added by odis.py.
# Regenerate with tools/busrender/odis.py (family.yaml: --yaml).

