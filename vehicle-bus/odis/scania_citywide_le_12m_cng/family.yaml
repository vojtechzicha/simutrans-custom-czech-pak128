agency: ODIS
type: "Citywide_LE_12M_CNG"
# Sprites carry their own lane placement (body footprint on the median of
# native pak128.cs 12 m buses), so no extra shift.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true
copyright: VTPsim

display:
  agency_en: "ODIS"
  agency_cs: "ODIS"
  family_en: "Scania Citywide LE 12M CNG"
  family_cs: "Scania Citywide LE 12M CNG"

# Scania Citywide LE 12M CNG (CNG; engine_type diesel, no smoke), the tall CNG
# fairing over the front half. Transdev Slezsko 4: 42-1201, 1202 (2016),
# 51-1201, 1202 (2018). 3ČSAD white-green (Transdev Slezsko, the colours of ex
# ČSAD Havířov / Karviná / Frýdek-Místek; seznam-autobusu "3ČSAD, bílo-zelená &
# logo dopravy Moravskoslezského kraje"): white, black window band, green skirt
# with a dark pinstripe, green lower front and rear, the kraj ring in greens.
# Z-Group bus 12 (2018): Z-Group bus (ex ČSAD Vsetín; Kopřivnice, Opava and
# Vítkov depots): white, black window band, the kraj ring in its own colours
# (grey, the red and blue inner bands), navy fleet numbers.
# Sprite: VTPsim's pak128.cs Citywide LE suburban (CZ-ODIS-
# ScaniaCitywideLE128M_Suburban-Green, frozen in
# tools/busrender/src/odis/) ported by odis_town.port_native, its ring
# stand-in painted out, the CNG fairing, the kraj ring and the white LED
# displays added by odis.py.
# Regenerate with tools/busrender/odis.py (family.yaml: --yaml).

