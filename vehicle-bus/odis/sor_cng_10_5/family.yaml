# SOR CNG 10,5 (CNG; engine_type diesel, no smoke). Transdev Morava 7 (2019):
# 64-2101 to 2107 (Bílovecko). Transdev Morava livery (seznam-autobusu: "bílá &
# červené logo Transdev & logo dopravy Moravskoslezského kraje"): white, black
# window band, the big red Transdev figure, the kraj ring in salmon and reds
# over the rear axle. Transdev Slezsko 19 (2016): 73-0021 to 0039
# (Českotěšínsko), 3ČSAD white-green (Transdev Slezsko, the colours of ex ČSAD
# Havířov / Karviná / Frýdek-Místek; seznam-autobusu "3ČSAD, bílo-zelená & logo
# dopravy Moravskoslezského kraje"): white, black window band, green skirt with
# a dark pinstripe, green lower front and rear, the kraj ring in greens. Z-Group
# bus 11: Z-Group bus (ex ČSAD Vsetín; Kopřivnice, Opava and Vítkov depots):
# white, black window band, the kraj ring in its own colours (grey, the red and
# blue inner bands), navy fleet numbers.
# Sprite: original box-model render (vojtechzicha): OSorCNG105 of
# tools/busrender/odis.py (on the SorCN105 body of iredo_models.py) with
# the livery of odis.py.
# Regenerate with tools/busrender/odis.py (family.yaml: --yaml).

