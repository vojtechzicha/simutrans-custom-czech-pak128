# SOR ICNG 10,5 (CNG; engine_type diesel, no smoke), the 2025 SOR face, the CNG
# pod over the front half, doors 1-2-0. Transdev Slezsko, Českotěšínsko II from
# 13 Dec 2026 (delivered 10/2026 with SOR ICNG 12,3 and Crossway LE LINE 12M NP
# (2025), about 38 buses in all). In the kraj's ODIS scheme ("schéma ODIS,
# červeno-černá", every new contract from 12/2025): signal red with a black
# window band, the white folk-ornament line under the windows, the big white
# ODIS logo, no ring.
# Sprite: original box-model render (vojtechzicha): OSorICNG105 of
# tools/busrender/odis.py (on the SorICN105 body of
