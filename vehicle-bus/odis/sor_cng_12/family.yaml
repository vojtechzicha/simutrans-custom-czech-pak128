agency: ODIS
type: "SOR_CNG_12"
# Sprites carry their own lane placement (body footprint on the median of
# native pak128.cs 12 m buses), so no extra shift.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true
copyright: vojtechzicha

display:
  agency_en: "ODIS"
  agency_cs: "ODIS"
  family_en: "SOR CNG 12"
  family_cs: "SOR CNG 12"

# SOR CNG 12 low-entry interurban (CNG; engine_type diesel, no smoke), the tank
# fairing over the front half and the A/C box on the raised rear roof. Transdev
# Morava 24 (2018-2019): 62-1101 to 1109, 24-1101 to 1115 (Hlučínsko, 555).
# Transdev Morava livery (seznam-autobusu: "bílá & červené logo Transdev & logo
# dopravy Moravskoslezského kraje"): white, black window band, the big red
# Transdev figure, the kraj ring in salmon and reds over the rear axle. Transdev
# Slezsko 82 (2014-2018; Havířov, Český Těšín, Karviná, Orlová, Frýdek-Místek):
# 3ČSAD white-green (Transdev Slezsko, the colours of ex ČSAD Havířov / Karviná
# / Frýdek-Místek; seznam-autobusu "3ČSAD, bílo-zelená & logo dopravy
# Moravskoslezského kraje"): white, black window band, green skirt with a dark
# pinstripe, green lower front and rear, the kraj ring in greens. Two 2014 cars
# have a green CNG pod (not drawn). White with the green ring: Transdev Morava
# 24-1120 (2015, ex MHD Bruntál, the BRUNTÁL emblem removed). Z-Group bus 62
# (Novojičínsko východ, Opavsko, Vítkovsko): Z-Group bus (ex ČSAD Vsetín;
# Kopřivnice, Opava and Vítkov depots): white, black window band, the kraj ring
# in its own colours (grey, the red and blue inner bands), navy fleet numbers.
# Sprite: original box-model render (vojtechzicha): OSorCNG12 of
# tools/busrender/odis.py (on the SorCNG body of iredo_models.py) with
# the livery of odis.py.
# Regenerate with tools/busrender/odis.py (family.yaml: --yaml).

