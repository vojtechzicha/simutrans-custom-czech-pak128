# ornament line under the windows, the big white ODIS logo, no ring.
# Sprite: VTPsim's Rošero First (the IREDO white sheet, vehicle-
# bus/iredo/rosero_first) repainted red by odis_town.repaint, the
# ornament line, the ODIS logo and the CNG box added by odis.py.
# Regenerate with tools/busrender/odis.py (family.yaml: --yaml).

