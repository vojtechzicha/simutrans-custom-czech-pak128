# ROŠERO-P First FCLLI CNG (CNG; engine_type diesel, no smoke) on the Iveco
# Daily. Transdev Slezsko 2: 74-4001, 4002 (Jablunkovsko-Třinecko, from
# 12/2025). In the kraj's ODIS scheme ("schéma ODIS, červeno-černá", every new
