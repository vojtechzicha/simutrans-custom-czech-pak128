# MAN Lion's City NL 293 (A21, the 2004-2019 Lion's City generation with the
# 2008 facelift front), on Prague city lines 115 / 221 / 227: ČSAD Polkost
# 1578 (2014) and 1579 (2015), Stenbus 1739 (2012, ex-demonstrator).
# 11.98 x 2.50 x 2.88 m, wheelbase 6.12 m (overhangs 2.61 / 3.26 m), doors
# 2-2-2 (front overhang, ahead of the rear axle, behind the rear axle),
# MAN D0836 LOH 213 kW (EEV on 1739, Euro VI on 1578; seznam-autobusu.cz),
# orange Bustec LED displays, about 11 t, about 95 passengers.
# Livery: PID trikolora (photos 1578, 1579, 1739 on seznam-autobusu.cz):
# blue roof and a thin blue strip at the roof edge, black window band right
# up to it, white band under the windows (about 40 % of the lower body), red
# below; blue A-pillars, black windscreen with the display behind the glass,
# white mask with a red bumper and red corners round the headlights; blue
# top, black rear window, white and red lower rear.
# Sprite: box-model render (agent man, tools/busrender/praha_man.py
# OldGen), same projection, lane placement and PID palette as the DPP
# Streetway / SOR NB 12 sheets.
# The upstream CZR-IDSJMK MAN_NL283_Lion_City (VTPsim) art was the shape
# reference; it was not reused because it is flat-shaded, has grey
# non-lighting glass and green displays. The same parametric body draws the
# Lion's City L (NL 323) and Brno's NL 283. Engine grille in the right rear
# corner, rear A/C, amber LED displays.

