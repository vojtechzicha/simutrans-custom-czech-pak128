# MAN Lion's City 12 EfficientHybrid: Arriva City 9151-9154 (2021) and 9168 /
# 9169 (2023), type NL 280 (D1556 LOH 206 kW), and ČSAD Polkost 1650-1652
# (2025), type NL 330 (D1556 LOH 243 kW), on Prague city lines 115 / 146 /
# 163 / 209 / 227 (seznam-autobusu.cz). The same 12.185 m body as the 12C,
# doors 2-2-2 on every car on city lines (photos 9152, 9168, 1650; only the
# ex-demonstrator 1596, not on city lines, is 2-2-0), 30+2+1 seats, about 90
# passengers. Stats use the NL 330 (243 kW).
# Livery: PID scheme A as the 12C (photos 1650, 1651, 9152, 9168, 9169).
# Sprite: the 12C render (agent man, tools/busrender/praha_man.py Hybrid, the
# user's variant v2) plus the MAN hybrid roof module (the ultracapacitor
# box): a light box with dark grilles behind the A/C fairing, over the rear
# axle, as on 9168 and 1651.

