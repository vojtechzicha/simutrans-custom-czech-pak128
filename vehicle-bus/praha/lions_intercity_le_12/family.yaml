# MAN Lion's Intercity LE 12, type LEÜ 330 (low-entry suburban bus, series
# from 2020): Vega Tour 8431-8434 (2024 / 2026), 8434 seen on Prague city line
# 238. 12.28 x 2.55 m, wheelbase 6.09 m, doors 1-2-0 (single-leaf front door,
# double door ahead of the rear axle), MAN D1556 LOH 243 kW (Euro VI-E),
# about 90 passengers, air conditioning (seznam-autobusu.cz, cars 8431,
# 8434). Same body at ČSAD Polkost 1603-1635 (suburban).
# Livery: PID scheme A (photos 8431 left side, Polkost 1616 right side):
# grey body, black window band reaching lower in the low-entry front, red
# columns round the front arch (door 1 to behind the arch) and the rear arch
# (door 2 to behind the arch) crossing the roof, new-generation MAN black
# face with red on the vehicle's left of the lower front.
# Sprite: box-model render (agent man, tools/busrender/praha_man.py
# IntercityLE, the user's variant v1): the 12C face, fairing and fins, the
# higher glass of the raised rear, engine louvres low in the rear corners,
# amber LED displays.

