# SOR NB 12 City, low-floor 12 m city bus: 12.18 x 2.55 x 3.11 m, 4 double
# doors, about 88 places, Iveco Tector 210 kW, 80 km/h; built from 2009 (the
# same type as DPP's 3641-4100).
# On Prague city lines (21-29 Sep 2026): Arriva City 9400-9403 (2012),
# 9466-9483 (2015-16) and 9115-9124 (2017-18), ABOUT ME 1962-1964 (2013), all in
# the old PID trikolóra; ARANEA 1481 (2013) plain white; ARANEA 1478 (2011) and
# Stenbus 1740 (2012), both ex-DPP, still in the DPP city scheme. The
# advertising wraps (9116, 9122, 9123, ARANEA 2454) are not drawn.
# Liveries: trikolóra = ultramarine roof and cant rail, black glazing band,
# narrow white band, red lower body, black windscreen and mask over a white
# front with a red bumper (photos of 9120, 9124, 9401, 9402, 9467, 1964);
# white = plain white with black glazing (photo of 1481); city = white roof and
# body, black window band, red lower body (photos of 1478 next to DPP 4072,
# 1740).
# Sprite: the DPP NB 12 sheets (VTPsim's pak128_czr Praha NB 12, repainted and
# lane-normalised in the DPP family, with the roof A/C unit behind the front
# roof edge that every photographed car carries: blue on the trikolóra cars as
# on 9120, white on the others), copied 1:1; the white livery is the city
# sheet with its red turned into the white of the same face.

