# CANDIDATE (under review). Solaris Urbino 12 IV electric, DPO 5008-5031: 24
# cars, built 2022, in service 3/2022-12/2022, all running in 2026 (20 at
# Hranečník, 4 at Poruba). 12 m, doors 2-2-2, 28 seats + 57 standing = 85,
# ZF CeTrax traction motor 300 kW (seznam-autobusu.cz: Medcom electrics),
# Solaris High Power batteries over 90 kWh, charged by plug in the depot or by
# an OppCharge inverted pantograph (Hranečník, Valchařská, Svinov). DPO blue
# with the white stripe, like the diesel Urbino 12 IV. Up to 70 more are on
# order for 2027-2028 (same type, larger batteries); not separate here.
# Until now the e-buses were only covered by the diesel Urbino 12 IV object;
# this is a new object, the diesel family is unchanged.
# Sprite: TommPa9's DPO Urbino 12 IV sheet with the roof battery fairing
# added by tools/busrender/dpo_derived.py: the long fairing from the front
# dome to about 1 m before the tail, the black front part of its sides, the
# white "ooo" e-mark near the rear and the OppCharge contact rails above the
# front axle. No other body change: the diesel's rear has no exhaust or engine
# tower in the drawing either.
# Economy relative to the diesel Urbino 12 IV (cost 912 498, runningcost 31):
# dearer to buy, cheaper to run, like the other VZ e-buses (Tábor Urbino 12
# electric 1 000 000 / 20, DPO 36Tr partial trolleybus 1 075 000 / 19).

