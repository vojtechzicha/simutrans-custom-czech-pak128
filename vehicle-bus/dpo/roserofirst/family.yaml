# Rošero-P First FCLLI / FCLLI CNG: Iveco Daily based low-entry midibus,
# ~7.7 m, ~30 passengers, ~110 kW. DPO took delivery of 5 units 2018–2021,
# all in service.
# Sprite drawn from scratch from photos of 5303/7311 (box model in the pak128
# projection, native short-bus proportions): turquoise all over, Iveco Daily
# bonnet with black grille and swept headlights, big windscreen with display,
# dark side windows, two doors on the right (behind each axle), turquoise CNG
# roof pod, small wheels with turquoise hub caps.

