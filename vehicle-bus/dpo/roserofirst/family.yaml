agency: DPOstrava
type: "RoseroFirst"
# Sprite carries its own tile placement (native bus footprint), so no extra
# shift (the default [0, 4] would sink it 4 px).
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true
copyright: VTPsim

display:
  agency_en: "DPO"
  agency_cs: "DPO"
  family_en: "Rošero First CNG"
  family_cs: "Rošero First CNG"

# Rošero-P First FCLEI CNG: DPO 7311-7312 (2021), Iveco Daily 70C low-entry
# midibus, about 8.0 m, Iveco F1C CNG 100 kW, doors 2-2 (a double door behind
# the front wheel, a double door with a ramp behind the rear axle). Not the
# electric First FCLLI (DPO 5301-5305, 2018-19, doors 1-2), which this family
# does not draw.
# Sprite: VTPsim's LE 37 art of the Prague package (vehicle-bus/praha/
# stratos_le_37, frozen in tools/busrender/src/dpo/; the Prague Rosero First
# sheet is the same drawing with a single rear door) repainted in DPO turquoise
# by tools/busrender/dpo_other.py (dpo_other_rebase.py), from photos of 7311:
# 2021 Daily front (white line on the bonnet, lamps at the bonnet corners,
# black bumper), black window frames with the white line under them, the
# turquoise CNG fairing over the rear two thirds of the roof with the Webasto
# A/C box ahead of it, turquoise wheel rims.

vehicles:
  - id: "RoseroFirst"
    role_en: "minibus"
    role_cs: "minibus"
    row: 0
    prev: []
    next: []
    fields:
      cost: 245000
