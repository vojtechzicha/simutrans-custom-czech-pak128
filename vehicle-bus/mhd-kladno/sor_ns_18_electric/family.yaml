# Sprites carry their own lane placement (body footprint on the median of
# native pak128.cs 12 m buses, each section placed by the section rule), so
# no extra shift.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "MHD Kladno"
  agency_cs: "MHD Kladno"
  family_en: "SOR NS 18 electric"
  family_cs: "SOR NS 18 electric"

# SOR NS 18 electric, 8 units (59-66; first unit in trial service 1/2024,
# series 7-9/2024). Two-section fixed consist: front section A + powered rear
# section B (240 kW asynchronous motor, 411 kWh); both halves required;
# 4 doors (2 per section).
# Low white battery fairings along both roofs. "Městská doprava Kladno"
# scheme: black front visor over the windscreen and the front roof dome, red
# headlight corners; black window band, bold red lower band straight under
# the windows, white skirt; black upper rear around the rear window, white
# middle, black bumper; amber destination displays.
# Sections 8 + 6 carunits as the DPMHK NS 18 (joint at the real 11.1 m).
# Sprite: original box-model render (vojtechzicha): the dpmhk.py SOR NS 18 body
# on the common SOR base, painted by tools/busrender/sor_town.py. Regenerate
# with tools/busrender/sor_town.py.
# Data: 18.75 m, 48 + 102 = 150 passengers split 90/60, 240 kW, 80 km/h,
# ~19 t (type values).

