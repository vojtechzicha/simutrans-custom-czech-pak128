# Sprites carry their own tile placement (VTPsim's NB 18 geometry sits on the
# native pak128.cs lane; the articulated normaliser applied no shift), so no
# extra makeobj offset.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

