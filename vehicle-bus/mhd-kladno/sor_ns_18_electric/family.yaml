  agency_en: "MHD Kladno"
  agency_cs: "MHD Kladno"
  family_en: "SOR NS 18 electric"
  family_cs: "SOR NS 18 electric"

# SOR NS 18 electric, 8 units (59-66; first unit in trial service 1/2024,
# series 7-9/2024). Two-section fixed consist: front section A + powered rear
# section B (240 kW asynchronous motor, 411 kWh); both halves required;
# 4 doors (2 per section).
# Built on VTPsim's SOR NB 18 articulated geometry (CZR-Praha-SOR_NB_18) with
# NS styling redrawn: black front visor over the windscreen and front roof
# dome, white lower front with red headlight corners; black band above flush
# single-pane side glazing; the front section's third door removed; low white
# battery fairings along both roofs. "Městská doprava Kladno" scheme: black
# window band and sill, bold red lower band straight under the windows, white
# skirt; black upper rear around the rear window, white middle, black bumper;
# silver bellows; amber destination displays.
# Data: 18.75 m, 48 + 102 = 150 passengers split 90/60, 240 kW, 80 km/h,
# ~19 t (type values).

