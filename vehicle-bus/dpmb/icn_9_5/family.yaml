# SOR ICN 9,5 low-entry midibus, DPMB Brno 7527-7546: 20 delivered in
# batches from January 2025 (19 active in 2026, one stored). 9.55 x 2.525 x
# 3.12 m, wheelbase 4.30 m, 9.2 t empty, 2 doors (single front + double
# centre), 25-29 seats / 75 total (DPMB), FPT NEF 6.7 184 kW, 80 km/h.
# Livery: DPMB city scheme: white body and roof, continuous black window
# band, red lower body from the skirt to about a third of the side height
# (a white strip separates it from the windows; photos of 7529 / 7531 - the
# research note's "~40 %" is too high) continuing round the rear; black
# windscreen / display mask, white lower front with silver headlamp clusters
# and a red bumper sweeping up at the corners; short white A/C pod ahead of
# the rear axle; green LED displays.
# Sprite: original box-model render (vojtechzicha) on the common SOR base
# (iredo_models.SHAPE low, the owner's pick of 2026-10-24): SorICN95 in the
# DPMB white-red, green LED displays; regenerate with
# tools/busrender/sor_city.py.

