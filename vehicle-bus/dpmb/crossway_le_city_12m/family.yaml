# Iveco Crossway LE CITY 12M NP (CNG, Cursor 9 NP) — 2 cars, 7829 (built 2021,
# run by DPMB on lease from Iveco as 2744II from 4 Jun 2021, bought 5/2024)
# and 7830 (ex-demonstrator built 2019, bought 6/2024). Doors 2-2-1, raised
# floor behind the middle door. 265 kW; 12 x 2.55 m; ~12 t and ~95 places
# are type figures (DPMB publishes none for this type); 85 km/h.
# DPMB white-red after the DPMB drawing crossway-le-2021.png and bmhd.cz
# photos of 2744II: white body, black window band; a red line under the
# windows only along the raised rear part (behind the middle door), where the
# window band ends higher; white belt, red skirt; black windscreen over a red
# band, white front panel, red bumper; two white CNG tank fairings on the
# roof (front one longer and taller); green LED displays.
# Sprite: Lubak91's CZR-Brno-IVECO_Crossway_LE_City_12M (upstream cols 1-8),
# lane placement normalised (it sat 3-12 px off the native lane), red line
# cut back to the rear part, roof CNG fairings drawn on, glass moved to the
# lit-window specials, green displays.

