# SOR NS 12 (diesel), DPMB's second most numerous bus: 51 delivered from
# August 2020 to January 2023 (7687-7737; 7687 in service 28 Aug 2020),
# 47 active in 2026 (4 stored). FPT Tector 7 210 kW, 12 000 x 2 550 mm,
# 10.64 t, capacity 105 (dpmb.cz), 80 km/h, 3 double doors.
# DPMB NS-body scheme (DPMB drawing sor-ns.png, photos of 7689/7690/7732/7737):
# white body and roof, black window band, white belt, red skirt; a black cap
# wraps the windscreen and the front roof edge, framed by the red-and-white
# swoosh up the front corners; black front mask above a white "smile" line and
# a red apron; green LED displays; one A/C unit on the roof 0.47-0.66 of the
# length from the front.
# Sprite: original box-model render (vojtechzicha): the dpmhk.py SOR NS 12 body
# on the common SOR base (the same body as the DPMB TNS 12), painted by
# tools/busrender/sor_town.py. Regenerate with tools/busrender/sor_town.py.

