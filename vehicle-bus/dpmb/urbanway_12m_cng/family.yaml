# Iveco Urbanway 12M CNG — DPMB's most numerous 12 m bus: 56 delivered in
# 2015 (7045II-7100II; first cars reached the Slatina depot on 22 Jan 2015),
# 54 active in 2026. Iveco Cursor 8 CNG, 213 kW; 12 000 x 2 500 mm, 12.35 t,
# capacity 81 (dpmb.cz), 80 km/h. DPMB white-red city scheme: white body and
# roof, black window band, red skirt; green LED destination displays.
# Unlike the 13 diesel cars (7672-7686) they carry a long white CNG tank
# fairing over the rear half of the roof (DPMB drawing: ~0.48-0.86 of the
# length from the front) plus the front roof A/C unit.
# Sprite: Lubak91's CZR-Brno-IVECO_Urbanway_12M (upstream cols 1-8), glass
# moved to the lit-window specials, roof tank fairing and A/C drawn on.

