# Irisbus Citelis 12M CNG, DPMB Brno 7008II-7010II and 7012II (4 active of
# 6 delivered in 2014; 7007II stored). 11.99 x 2.50 m, 12.21 t, capacity
# 89, Iveco Cursor 8 CNG 213 kW, 80 km/h (dpmb.cz). 3 double doors.
# Livery: DPMB white-red city scheme after the DPMB side drawing
# citelis-cng.png: white body and roof, black window band, red skirt, lime
# LED displays. The white CNG tank fairing covers the rear half of the roof
# (drawing and rear photo of 7009; the research note "front two-thirds" is
# wrong), with the Autoclima A/C unit at the front of the roof.
# Sprite: replaces the upstream CZR-Brno-Irisbus_Citelis_12M (blank sw
# direction, flat roof). Box-model render calibrated to the repo's DPMP
# Citelis 12M (TommPa9 body), same projection as the DPP/DPMB bus renders.

