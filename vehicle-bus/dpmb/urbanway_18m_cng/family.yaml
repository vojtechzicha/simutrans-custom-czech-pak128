# Iveco Urbanway 18M CNG — articulated CNG bus, 44 delivered 2017-2018
# (2001II-2044II; first car arrived 24 Oct 2017, first passenger service
# 27 Nov 2017), 41 active in 2026 — the first articulated CNG buses in CZ/SK.
# 243 kW, 17 910 x 2 500 mm, capacity 129 (dpmb.cz), 80 km/h. Empty weight is
# not reliably published (dpmb.cz repeats the length as "17 910 kg"); ~17.5 t
# assumed, split 10 + 8 t. DPMB white-red city scheme, green LED displays.
# Roof per the DPMB drawing: a tall rounded CNG tank fairing on both sides of
# the joint (rear ~40 % of the front section, front ~35 % of the rear
# section) plus low A/C / tank boxes; the diesel-era upstream art had a flat
# roof. Two-section fixed consist: front section A (unpowered) + powered rear
# section B (engine tower at the rear).
# Sprite: original box-model render (vojtechzicha): the dpmhk.py Iveco
# Urbanway 18M CNG body (sections 8 + 6) in the town palette dpmb_uw painted
# by tools/busrender/sor_town.py (until 2026-10-28 the hand-drawn upstream
# sheet). Regenerate with tools/busrender/sor_town.py.

