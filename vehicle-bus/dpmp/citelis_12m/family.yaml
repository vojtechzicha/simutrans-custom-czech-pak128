# Irisbus Citelis 12M. DPMP runs 3 diesel cars (183, 186, 194) and 16 CNG
# cars (207–229) as of 2026 (dpmp.cz / trolejbus.cz). The CNG version is
# visually distinct by its roof tank fairing, so it is its own vehicle and
# sprite row. Capacity 28–32 seated / 65 standing; diesel Iveco Cursor 8
# 180 kW, CNG Cursor 8 CNG 200 kW. Sprite: TommPa9's Praha Citelis 12M,
# repainted to the DPMP white-red (NRP) scheme; the CNG row adds the raised
# roof tank fairing over the front ~60 % of the roof.

