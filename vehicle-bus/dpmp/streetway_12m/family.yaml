# Iveco Streetway 12M (Otokar Kent C based). DPMP bought the 2021 Iveco
# demonstrator (199) in 2022, the first Streetway in Czech service, and runs
# it in the demonstrator scheme: white body, black glasshouse and front mask,
# red-orange swoosh on the rear side. 34 seated / 56 standing, Cursor 9
# 228 kW. Sprite: the Lubak91 Urbanway 12M body reworked with the Streetway
# front mask and livery.

