agency: DPPardubice
type: "Streetway_12M"
# Sprites carry their own lane placement (body footprint on the median of
# native pak128.cs 12 m buses), so no extra shift.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true
copyright: vojtechzicha

display:
  agency_en: "DPMP"
  agency_cs: "DPMP"
  family_en: "Iveco Streetway 12M"
  family_cs: "Iveco Streetway 12M"

# Iveco Streetway 12M (Otokar Kent C based). DPMP bought the 2021 Iveco
# demonstrator (199) in 2022, the first Streetway in Czech service, and runs
# it in the demonstrator scheme: white body, black glasshouse and front mask,
# red-orange swoosh on the rear side. 34 seated / 56 standing, Cursor 9
# 228 kW. Sprite: original box-model render (vojtechzicha): the dpmhk.py Iveco
# Streetway 12M body (its own, after 38 photos) with the demonstrator's orange
# swoosh painted by tools/busrender/sor_town.py (until 2026-10-28 the hand-
# drawn upstream sheet). Regenerate with tools/busrender/sor_town.py.

