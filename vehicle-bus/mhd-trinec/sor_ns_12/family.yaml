# SOR NS 12 (diesel), 19 units on MHD Třinec: Arriva 71-1101…1112 and the
# Transdev subcontract 71-1151…1157, delivered 12/2021–11/2024. "Třinec city"
# white/lime scheme: lime A/C pod on the roof, black front mask
# with lime A-pillars and line under the windscreen, lime skirt and wheel
# arches, lime upper rear and bumper.
# Data: 12 m, ~100 passengers (estimate from GVW), FPT Tector 7 210 kW,
# 80 km/h, ~11.5 t empty.
# Sprite: original box-model render (vojtechzicha): the dpmhk.py SOR NS 12 body
# on the common SOR base, painted by tools/busrender/sor_town.py. Regenerate
# with tools/busrender/sor_town.py.

