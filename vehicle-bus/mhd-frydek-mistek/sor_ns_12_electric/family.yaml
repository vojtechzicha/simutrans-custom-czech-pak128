agency: MHDFrydekMistek
type: "SOR_NS_12_electric"
copyright: VTPsim

# The source sprites carry the upstream lane placement (their dats use no
# offset), so no extra shift; the default [0, 4] would sink them 4 px.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "MHD F-M"
  agency_cs: "MHD F-M"
  family_en: "SOR NS 12 electric"
  family_cs: "SOR NS 12 electric"

# SOR NS 12 electric: 644-645 (2018, dark green metallic e-bus scheme) and
# 723-734 (2024, Frýdek-Místek city wrap - second livery).

vehicles:
  - id: "SOR_NS_12_electric"
    role_en: "bus"
    role_cs: "autobus"
    row: 0
    head: true
    tail: true
    prev: []
    next: []
    fields:
      cost: 950000
      payload: 85
      speed: 80
      weight: 12
      runningcost: 20
      fixed_cost: 150
      intro_year: 2018
      intro_month: 1
      waytype: road
      freight: Passagiere
      engine_type: battery
      power: 160
      gear: 53
      length: 8
      retire_year: 2050
      retire_month: 1

liveries:
  - color: zelenametaliza
    name_en: "metallic green"
    name_cs: "zelená metalíza"
  # 2024 batch 723-734: white roof with battery fairings and a black front
  # visor, flush black glazed side, white body with a blue speckled skyline
  # strip in the lower half (from the front axle back), black upper front mask
  # with white lower bumper, white rear. Painted on the zelenametaliza sheet,
  # identical geometry and placement.
  - color: frydekmistekpolep
    name_en: "Frýdek-Místek city wrap"
    name_cs: "polep města Frýdek-Místek"
