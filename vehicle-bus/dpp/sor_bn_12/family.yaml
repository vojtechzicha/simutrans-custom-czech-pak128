  agency_en: "DPP"
  agency_cs: "DPP"
  family_en: "SOR BN 12"
  family_cs: "SOR BN 12"

# SOR BN 12 low-entry bus, DPP Prague 4511-4560: 50 buses built 2017-18, in
# service from May 2018 (plus 3999 of 2012 in the city scheme, and ten
# 2008-09 rentals in other liveries). 11.79 x 2.525 x 2.95 m, 9.7 t, 2 doors
# (single front, double centre), capacity 88 (dpp.cz), 210 kW, 80 km/h.
# Livery: old PID regional scheme (C): dark ultramarine-blue roof and roof
# edge, black window band, white band under the windows, red lower half;
# red lower front mask under a white upper mask; amber LED displays.
# Second livery: DPP city scheme on 4507 (ex 3999, built 2012; photo 2020s):
# white roof and body, black window band, white band, red lower body, black
# windscreen and mask over a red lower front.
# Sprite: original box-model render (vojtechzicha) on the common SOR base (the
# owner's pick of 2026-10-24): SorBN12 (doors 1-2-0) in the PID trikolóra of
# pid.py and the DPP city scheme of tools/busrender/iredo_models.py; length 8;
# regenerate with tools/busrender/sor_city.py.

