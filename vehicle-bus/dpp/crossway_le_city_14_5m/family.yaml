# Iveco Crossway LE CITY 14,5M, DPP Prague 4602-4611 (4602-4607 in service
# from Apr 2023, 4608-4611 from Sep 2026; seznam-autobusu.cz), mainly on the
# Airport Express AE and
# suburban lines. 3-axle low-entry bus: tag axle behind the drive axle,
# doors 2-2-1 (front, ahead of the tandem, single door in the rear
# overhang), raised floor and belt line behind door 2. 14.49 x 2.55 x
# 3.205 m, 14.0 t, capacity 109 (41 seated), Cursor 9 265 kW, 85 km/h
# (dpp.cz). 4601 (2018, classic white-red) is not modelled.
# Livery: PID scheme A: light silver-grey body and roof, continuous black
# window band, black windscreen/display surround, red columns behind door 1
# over the front axle and behind door 2 over the tandem (skirt to window line,
# resuming above the windows and crossing the roof), red block on the
# vehicle's left of the lower front and lower rear.
# Sprite: replaces the upstream CZR-Praha-IVECO_Crossway_LE_City_14M (Lubak91;
# a 2-axle copy of the Brno object). Box-model render with the geometry of
# the DPMB Crossway LE 14,5M side drawing (axles 2.64/9.52/11.05 m from the
# front), same projection and PID palette as the DPP Streetway set.

