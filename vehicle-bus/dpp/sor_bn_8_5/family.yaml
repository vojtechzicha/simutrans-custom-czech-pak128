# SOR BN 8,5, low-entry midibus: 8.5 x 2.525 x 2.9 m, doors 1-2-0, about 21
# seats / 60 total, Iveco Tector 5 137 kW; built from 2010. It is the BN 9,5
# with about 1.2 m less wheelbase: one window bay between the front axle and the
# centre door instead of two (photos), the rear with the raised floor, engine
# grille and overhang unchanged.
# DPP 2071 (ex-2022), a 2013 SOR demonstrator, with DPP since 2016 (garage
# Řepy); a one-off, not seen on city lines in the Sep 2026 survey.
# Livery: DPP classic city scheme: white roof and cant rail, black glazing
# band, white band, red lower body from the wheel-arch tops, black upper front
# mask with the DPP logo over a red bumper (Wikimedia Commons photos "Zličín,
# SOR BN 8,5 DPP" and "V Šáreckém údolí, autobus SOR BN 8,5").
# Sprite: VTPsim's pak128_czr SOR BN 9,5 shortened as the Praha BN 8,5 (same
# body), the blue roof repainted white (the shades of the DPMP BN 9,5), the
# black front mask kept, glass converted to the lit-window specials, the
# green-light displays made amber LED, lane placement normalised.

