# SOR NB 18 City, DPP Prague's standard articulated bus: 357 in service
# (Sep 2026) from 2011-2020 (6711-6769 remnants, 6771-6999, 5001-5100; the
# 2009-11 cars are being withdrawn). First in service 1 Oct 2009. 18.75 x
# 2.55 m, 15.7 t, 5 double doors, capacity 143 (dpp.cz), Iveco Cursor 8
# 243 kW pusher, 80 km/h.
# Livery: DPP classic city scheme (B) as on the NB 12: white body and roof,
# black window band, narrow white band, red lower body, black upper front,
# grey bellows; amber displays (front, door-1 side, rear).
# Two sections like the upstream CZR-Praha-SOR_NB_18[1]/[2]: the front section
# (length 8) ends in the bellows, the powered rear section (length 6, about
# its drawn length) starts right behind it; the joint closes in all 8
# directions with the engine's 8-unit spacing. Sprite: VTPsim's art, glass
# converted to the lit-window specials, displays amber; the upstream's second
# side display over door 4 of the rear section (not on the real bus) removed.

