# SOR ICN 9,5 low-entry midibus, DPP Prague 2072-2091: 20 buses, the first
# entered service in November 2023. 9.55 x 2.525 x 3.12 m, wheelbase 4.30 m,
# 9.2 t empty, 2 doors (single front + double centre, "1-2-0"), 27 seats /
# 73 total, FPT NEF 6.7 184 kW + ZF Ecolife, 80 km/h.
# Livery: PID scheme A (2021): light silver-grey body and roof, continuous
# black window band, black windscreen / display mask with a grey roof cap,
# grey lower front with a large red block on the vehicle's left (bumper up to
# the headlamp line), solid red columns from the skirt to the window line over
# the front axle (door 1 .. first pillar) and over / ahead of the rear axle
# (door 2 .. just behind the rear wheel centre), continued above the windows
# and as solid bands across the roof; red block on the vehicle's left of the
# lower rear, dark rubbing strip on the grey panels, amber front / side / rear
# displays. The light-grey A/C pod is drawn between the two roof bands so the
# bands read solid at 1x (the real unit overlaps them slightly).
# Sprite: no upstream ICN exists; new 8-direction pixel render of the ICN body
# (brochure floor plan + flat side photos of 2080 / Brno 7531) at the scale
# of the native pak128 buses (9.55 m = 40 px in the side views, next to 51 px
# for the 12 m SOR NB 12 / NS 12), same body as the DPMB ICN 9,5.

