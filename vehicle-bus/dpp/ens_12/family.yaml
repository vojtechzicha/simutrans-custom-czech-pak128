# SOR ENS 12 (the SOR NS 12 electric, renamed 2025; Škoda Electric traction),
# 12.0 x 2.55 x 3.30 m battery bus with roof battery pods, 3 double doors
# (2-2-2), 29 seats / 92 total, 160 kW, 80 km/h, 12.9 t, 308 kWh. DPP 3015-3032
# (3022 written off 05/2026): 17 in service Sep 2026, in DPP service from
# 12/2025; 14 more due by 15 Dec 2026 (about 31). PID 2021 scheme: grey body,
# black window band and black front cap over the roof front, red columns over
# both wheel arches (behind door 1 / ahead of door 3) continued as red bands
# across the grey battery fairings, red block on the lower front, yellow door
# steps. Replaces the upstream CZR-Praha-SorNS12 placeholder (old PID livery,
# no roof batteries).
# Sprite: original 8-direction render of the NS 12 body (no upstream pixels;
# sized and lane-placed like the native pak128 12 m buses, e.g. CZR SOR NB 12).

