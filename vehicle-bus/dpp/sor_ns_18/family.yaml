# SOR NS 18 (diesel), DPP Prague 5998: one car, built 2021, delivered May 2021
# and in service from November 2021 (rented for a symbolic 100 CZK a month,
# first on line 125). 18.75 x 2.55 m, 4 double doors (2-2-2-2), Iveco Cursor
# F2C 243 kW (Euro VI step E) + ZF Ecolife, 80 km/h, about 150 passengers
# (seznam-autobusu, zdopravy.cz 12/2021).
# Livery: DPP city red-white (photos zdopravy.cz 12/2021): white roof, black
# glazing band up to the roof edge, a white band under it and red lower body;
# black front roof cap edged by the red SOR wing that runs down the A-pillar;
# black side panel ahead of the front wheel with the red bumper line along its
# foot; front: black mask, silver chevron band, white lamp clusters, red lower
# front; amber displays.
# Sprite: rendered by tools/busrender/praha.py on the NS 18 body of
# tools/busrender/dpmhk.py (the same body as the Praha NS 18 family): A/C
# behind the cap, a low unit mid front section, one on the rear section,
# louvred engine bay and engine-tower grille at the rear. Sections as the DPP
# NB 18 (8 + 6).

