# Irisbus Crossway LE 12,8M, DPP Prague 4505-4506 (ex 3515/3520, built 2011;
# the 2007-08 cars are gone); first DPP Crossway LE in service 15 Jan 2008.
# 12.76 x 2.55 x 3.215 m, 10.9 t, 3 doors, capacity 105 (dpp.cz), Cursor 8
# 243 kW, 85 km/h. Also stands in for the two Crossway LE CITY 13M (4508-4509,
# airport line AE) and the Crossway LE CITY 12M (4510), all in the same scheme.
# Livery: DPP classic city scheme as painted on the Crossways: white body and
# roof, black window band, a red stripe directly under the windows and the
# windscreen, white band, red lower body from the wheel-arch tops, red bumper.
# Sprite: Lubak91's CZR-Praha-IVECO_Crossway_LE_12.8M; its blue roof (not on
# the DPP cars) repainted white, the red sill stripe added, glass converted to
# the lit-window specials, displays amber, lane placement normalised. Upstream
# weight (18 t) and price (almost three NB 12) were wrong; now scaled from the
# NB 12. Length 8: the body is drawn as long as the 12 m NB 12.

