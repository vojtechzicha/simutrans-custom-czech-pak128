# Solaris Urbino 10,5 (4th generation), DPP Prague: 2301-2320 (20 buses, in
# service from Dec 2020) in the classic DPP city scheme and 2321-2340 (20
# buses, from Sep-Oct 2021) in the PID scheme. 10.55 x 2.55 x 3.05 m,
# 10.63 t, capacity 86, Cummins 204 kW, 85 km/h (dpp.cz); 3 double doors
# (front overhang, ahead of and behind the rear axle).
# Liveries (photos 2308/2313/2302 and 2330/2321):
# - dppcervenobila, DPP classic red-white (scheme B): white body and roof,
#   red lower band to about the upper half of the wheels with a white belt
#   above it, black window band (the Urbino IV black upper edge runs from the
#   windscreen back to door 2), black upper front, white mask, red bumper.
# - pidsedocervena, PID scheme A: grey body and roof, red columns over both
#   wheel arches (skirt to window line, crossing the roof), black glazing
#   band, red block on the vehicle's left of the lower front and rear.
# Sprite: replaces the upstream CZR-Praha-Solaris_Urbino_10 (TommPa9; PID
# batch in player-colour paint, non-darkening glass). Box-model render with
# the upstream's size and the Solaris Urbino IV layout, same projection as
# the DPP Streetway set. Both liveries share the 2020 intro date.

