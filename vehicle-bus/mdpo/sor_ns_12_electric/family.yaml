agency: DPOpava
type: "SOR_NS_12_electric"
copyright: VTPsim

# Sprites are placed in the tile to the native pak128.cs lane position (body
# footprint matched to the median of native 12 m buses), so no extra shift.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "MDPO"
  agency_cs: "MDPO"
  family_en: "SOR NS 12 electric"
  family_cs: "SOR NS 12 electric"

# SOR NS 12 electric (from 2025 marketed as ENS 12), MDPO 401-408 (2026).
# 12 m, 3 doors, ~30 + 62 = 92 total, 160 kW class, 411 kWh roof battery,
# 80 km/h, ~13 t.
# Sprite: VTPsim's SOR NS 12 body (pak128_czr Frýdek-Místek NS 12 electric),
# repainted in the 2026 e-bus scheme: white/silver-white body with no red skirt
# or roof band, black window band, roof battery and A/C pods, a thin red ribbon
# curling over the roof edge, down onto the front wheel arch and into one loop
# over the middle section; white SOR electric front mask with black glass.
# Lane placement normalised.

# Body edits on every view: window band deepened from 5 to 7 rows (real NS 12
# glazing), door leaves in lighter glass, amber front/side/rear displays.

vehicles:
  - id: "SOR_NS_12_electric"
    role_en: "bus"
    role_cs: "autobus"
    row: 0
    head: true
    tail: true
    prev: []
    next: []
    fields:
      cost: 950000
      payload: 92
      speed: 80
      weight: 13
      runningcost: 20
      fixed_cost: 150
      intro_year: 2026
      intro_month: 1
      retire_year: 2050
      retire_month: 1
      waytype: road
      freight: Passagiere
      length: 8
      engine_type: battery
      power: 160
      gear: 53

liveries:
  - color: mdpobilagrafika
    name_en: "MDPO white with red graphics"
    name_cs: "MDPO bílá s červenou grafikou"
