copyright: vojtechzicha

# Sprites carry their own lane placement (body footprint on the median of
# native pak128.cs 12 m buses), so no extra shift.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "MDPO"
  agency_cs: "MDPO"
  family_en: "SOR NS 12 electric"
  family_cs: "SOR NS 12 electric"

# SOR NS 12 electric (from 2025 marketed as ENS 12), MDPO 401-408 (2026).
# 12 m, 3 doors, ~30 + 62 = 92 total, 160 kW class, 411 kWh roof battery,
# 80 km/h, ~13 t.
# The 2026 e-bus scheme: white body with no red skirt or roof band, black
# window band, roof battery and A/C pods, a thin red ribbon falling from the
# roof edge over door 2 to the front wheel arch, running back under the
# windows with one oval loop up into the windows over the middle section and
# rising at the rear; white SOR electric front with black glass.
# Sprite: original box-model render (vojtechzicha): the dpmhk.py SOR NS 12 body
# on the common SOR base, painted by tools/busrender/sor_town.py. Regenerate
# with tools/busrender/sor_town.py.

