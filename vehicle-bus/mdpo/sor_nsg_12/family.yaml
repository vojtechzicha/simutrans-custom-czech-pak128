  agency_en: "MDPO"
  agency_cs: "MDPO"
  family_en: "SOR NSG 12"
  family_cs: "SOR NSG 12"

# SOR NSG 12 (CNG), MDPO 177-181 (2021, in service 1-2/2022). 12 m, 3 doors,
# ~95 total, FPT Cursor 8 CNG 213 kW, 80 km/h, 11.5-12 t.
# Sprite: VTPsim's SOR NS 12 body (pak128_czr Frýdek-Místek NSG 12), repainted
# in the MDPO white-red scheme: white roof with a large white CNG fairing and
# an A/C unit, red band along the roof edge sweeping down the A-pillar, black
# glazing, narrow white band, straight red skirt; black front mask, white
# strip, red apron. Lane placement normalised.

# Body edits on every view: window band deepened from 5 to 7 rows (real NS 12
# glazing), door leaves in lighter glass, amber front/side/rear displays.

