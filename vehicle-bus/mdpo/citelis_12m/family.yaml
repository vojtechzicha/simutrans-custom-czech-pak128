# Irisbus Citelis 12M, MDPO 148-161 (2011-2012), 12 in service (2026).
# Diesel Iveco Cursor 8 EEV ~213 kW, ~30 seated / ~70 standing, ~11 t.
# Sprite: TommPa9's all-white Praha Citelis 12M (the real Citelis body; the
# upstream CZR-Opava object was a copy of the base-pak Irisbus Citybus),
# painted in the MDPO white-red scheme: white roof, black window band, narrow
# white waist, red lower body from the wheel-arch tops to the sill, red front
# apron and rear bumper.

