# SOR BN 12 low-entry bus with the raised rear floor ("hump"), 11.79 m, 3 doors
# (1-0-2-2). One 2013-built ex-demonstrator, 62-9904, on Studénka MHD
# (Transdev Morava) since 12/2021. Iveco Tector 194 kW, ~30 seated + ~65
# standing, ~8.8 t.
# Sprite: VTPsim's SOR BN 12 (the diesel body without a CNG pod, via the
# pak128_czr Praha object; identical to the body of VTPsim's ODIS SOR BNG 12),
# repainted in Transdev white with the black belt line, the red Transdev
# running figure between the front axle and the middle door, white roof A/C
# units, glazed doors down to the floor; lane-normalised.

