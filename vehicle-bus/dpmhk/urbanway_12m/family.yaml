# Iveco Urbanway 12M, the largest DPMHK bus type (Sep 2026):
# - diesel, first-generation face: 173-195 (2018-2020; Tector 7 210 kW,
#   28 seated + 78 standing) and 117-127 (2023, in service 2/2024; Cursor 9
#   228 kW, 27 + 70); Voith DIWA; 34 buses.
# - Hybrid (2024 facelift face), 128-131 (2025, in service 6-8/2026): Cursor 9
#   228 kW mild hybrid, Voith DIWA NXT.
# 3 doors (the rear one behind the rear axle, then the black engine-bay panel).
# Livery: DPMHK classic red-yellow-white: white roof, black window band up to
# the roof edge, broad yellow band over red, on the left front corner a white
# panel, then swept-back yellow and red diagonals; first-generation face white
# with a silver grille band and a red bumper sweeping up at the corners; the
# 2024 face has a black windscreen surround, a white band with slim headlights
# and the IVECO letters, and a red bumper; rear: white top with the black rear
# window, yellow engine lid, red bumper. 19 of the diesels carry full-body
# adverts (not modelled).
# Sprite: new 8-direction box render; AC unit on the roof, the hybrid adds the
# battery/e-machine box at the front of the roof.

