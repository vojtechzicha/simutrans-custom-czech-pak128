# SOR EBN 9.5, DPMHK 401 (2013): the city's first battery bus, still in
# service in 2026 (battery replaced 2023; photographed in service 6/2026).
# 9.5 m midibus, 2 doors, ~55 passengers.
# Livery: "Zelená linka" since 9/2017, the DPMHK classic scheme with green
# additions: white roof, black window band with a green strip over the windows
# and a green band with tree silhouettes over the lower glass, thin yellow line
# over the red lower body, white panel and yellow/red diagonals on the left
# front corner, red A-pillar strips; black face with a green "smile" under the
# windscreen, red bumper.
# Sprite: new 8-direction box render (older SOR e-bus face), battery boxes on
# the roof.

