# SOR NS 12 (diesel), DPMHK 111-116: built 2022, in service 1-2/2023. Iveco
# Tector 7 210 kW Euro VI-E, ZF EcoLife, 3 doors, ~100 passengers.
# Livery: DPMHK classic red-yellow-white in its black-front execution for the
# SOR NS generation: black face with a yellow chin between the silver
# headlight clusters, red outline strips up the A-pillars and along the black
