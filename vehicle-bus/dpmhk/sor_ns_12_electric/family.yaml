# SOR NS 12 electric, DPMHK 404-423 (2018): 20 battery buses, 160 kW
# asynchronous motor, 225 kWh NMC battery (~180 km), 80 km/h, ~12.35 t, 3 doors,
# 100 passengers (29-35 seated).
# Livery: DPMHK classic red-yellow-white, black-front execution (see the
