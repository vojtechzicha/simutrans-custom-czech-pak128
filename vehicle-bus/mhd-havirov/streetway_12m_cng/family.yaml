# Iveco Streetway 12M CNG (bioCNG, built in Turkey), doors 2-2-2. Havířov MHD
# (Transdev Slezsko): 40-1325 to 40-1341, 17 cars (6/2023 - 12/2024), bought
# for the 2024-2033 city contract. Blue city scheme from new; the white city logo (three linked arches) and the yellow "město pro
# život" script on the lower side, the logo first reading left to right on
# both sides;
# white LED displays (photos zdopravy.cz, seznam-autobusu). The big white
# Transdev figure on the rear corners is left out (only noise at 1x). CNG:
# engine_type diesel, no smoke.
# Sprite: original box-model render (vojtechzicha): the Iveco Streetway body of
# tools/busrender/dpmhk.py in a sor_town.py palette (havirov), with the CNG
# fairing (Lubak91's Streetway sheets until 2026-10-28).
# Regenerate with tools/busrender/odis_town.py (family.yaml: --yaml).

