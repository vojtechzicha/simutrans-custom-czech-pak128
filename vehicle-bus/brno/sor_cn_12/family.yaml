# SOR CN 12, suburban bus with a raised floor: about 12.0 x 2.525 x 3.1 m,
# doors 1-2-0, about 45 seats / 95 total, Iveco Tector / Cursor about 194 kW;
# built from 2004.
# On Brno city line 74: BDS-BUS 7J1 5363 (IDS JMK scheme).
# Livery: IDS JMK regional scheme: light grey roof with a red line along the
# roof edges (the red cant rail down to the window tops and the red cap over
# the windscreen; the roof reads grey from above, photos of the BDS-BUS MAN
# 6J9 519x cars), a white A/C unit on the front roof section, black glazing band, white
# band under the windows, dark belt line at the wheel-arch tops, silver-grey
# lower body; front: white mask under the windscreen, grey bumper with the
# lamps; green LED destination displays (seznam-autobusu photo of 7J1 5363,
# 2025). The red and grey are the ones of the pak128_czr IDS JMK buses.
# Sprite: VTPsim's pak128_czr IREDO SOR CN 12 White (the cleaner of the two
# upstream CN 12 sheets): roof light grey with red edge lines, lower body under the belt
# line grey, the front roof hatch drawn as the white A/C box, the black
# NB-style front mask white over a grey bumper, glass converted to the
# lit-window specials, displays green LED (as the car; a plain colour, not the
# light special), lane placement normalised.

