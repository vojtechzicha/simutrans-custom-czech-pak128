# Iveco Urbanway 12M (diesel), BDS-BUS 6J2 3507: built 2019 (MHD Moravský
# Krumlov until 01/2022), since 03/2025 the reserve car for Brno city lines 48
# and 74. 12.0 x 2.5 m, 3 double doors (2-2-2, seznam-autobusu), air
# conditioning, FPT Tector 7 210 kW, about 100 passengers, 80 km/h, about 11 t.
# Livery: plain white (photos seznam-autobusu 422546 / 438496): white body, roof
# and 2013 face with the silver IVECO grille band, continuous black glazing
# band, white A/C unit over the front third of the roof, engine-bay grille low
# in the left rear corner; green LED displays, as the DPMB Urbanways.
# Sprite: rendered by tools/busrender/praha.py on the Urbanway 12M body of
# tools/busrender/dpmhk.py (the same body as the Praha Urbanway 12M).

