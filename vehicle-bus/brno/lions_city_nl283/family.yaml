# MAN NL 283 Lion's City (A21, the last builds of the 2004-2019 Lion's City
# body), BDS-BUS 6J9 5190-5192: built 2021, in service from 1/2022 (depot
# Pozořice), on Brno city line 48 (and regional 151). 11.98 x 2.50 x 2.88 m,
# wheelbase 6.12 m, doors 2-2-2, MAN D2066 LUH63 206 kW (Euro VI-D), ZF 6 AP
# 1400 B EcoLife, 31+1 seats, about 95 passengers, green Bustec LED displays,
# air conditioning (seznam-autobusu.cz, car 6J9 5190).
# Livery: IDS JMK regional scheme, "bílo-šedá s červenou střechou" (photos of
# 6J9 5190 / 5192, seznam-autobusu.cz 404916, 409944, 432981): white body,
# black window band up to a red line along the roof edge (the "red roof" is
# that edge strip; the roof top itself reads light grey from above), silver-
# grey lower body below about 0.86 m, black front face with the green
# display, white mask, grey bumper; white rear with a black rear window and a
# grey bumper; white rear A/C unit.
# Sprite: the old-gen Lion's City box model of the Prague NL 293 (agent man,
# tools/busrender/praha_man.py OldGen) in the IDS JMK colours, same lane
# placement.

