# Iveco Urbanway 18M — 18-metre articulated city bus. Two-section fixed
# consist: front section A (unpowered driver's cab end) + powered rear
# section B (carries the engine on this prototype). Both halves required.
#
# Source PNGs are two separate files (Iveco-Urbnaway-18M-A.png / -B.png with
# the original `Urbnaway` typo) at 1152×128 each, using cols 1–8 with col 0
# as the stacked-extras column. The build input PNG here merges them into a
# single 1024×256 sheet: row 0 = A (front), row 1 = B (rear).

