# SOR NS 18 (diesel), 1 unit: 97 (delivered 2022, in service 5 Jan 2023).
# Two-section fixed consist: front section A + powered rear section B
# (pusher, 243 kW); both halves required; 4 doors (2 per section).
# Built on VTPsim's SOR NB 18 articulated geometry (CZR-Praha-SOR_NB_18) with
# NS styling redrawn: black front mask and black visor over the front roof
# dome, yellow stripe up both A-pillars and along the lower mask edge, red
# apron between the headlights, black bumper; black band above flush
# single-pane side glazing; the front section's third door removed. DPmML
# white-yellow-red scheme: white roof with A/C units, black window band,
# black sill, white belt, three rows of yellow; yellow upper rear framing the
# rear window, red bumper; silver bellows; amber destination displays.
# Data: 18.75 m, 47 + 124 = 171 passengers split 103/68, 243 kW, 80 km/h,
# ~17 t (type values).

