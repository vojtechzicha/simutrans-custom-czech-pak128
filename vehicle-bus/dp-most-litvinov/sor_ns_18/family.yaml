# SOR NS 18 (diesel), 1 unit: 97 (delivered 2022, in service 5 Jan 2023).
# Two-section fixed consist: front section A + powered rear section B
# (pusher, 243 kW); both halves required; 4 doors (2 per section).
# DPmML white-yellow-red scheme as on the NS 12: white roof with an A/C unit
# on each section, black window band, yellow lower sides with a dark bottom
# trim; black front mask outlined in yellow with a red apron between the
# headlights; yellow upper rear, red bumper; green LED displays.
# Sections 8 + 6 carunits as the DPMHK NS 18 (joint at the real 11.1 m).
# Sprite: original box-model render (vojtechzicha): the dpmhk.py SOR NS 18 body
# on the common SOR base, painted by tools/busrender/sor_town.py. Regenerate
# with tools/busrender/sor_town.py.
# Data: 18.75 m, 47 + 124 = 171 passengers split 103/68, 243 kW, 80 km/h,
