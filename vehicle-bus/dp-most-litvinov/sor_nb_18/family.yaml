# SOR NB 18 City, 10 units + 1 arriving (189-199, ex-DP Praha, built
# 2009-11, transferred 7/2024 - 9/2026). Two-section fixed consist: front
# section A (driver's cab, 3 doors) + powered rear section B (pusher, Iveco
# Cursor F2B 243 kW, 2 doors); both halves required.
# Livery: the DPmML white with the yellow skirt line as worn by the repainted
# ex-Prague cars, a white A/C unit behind the front, red bumpers, green LED
# displays.
# Data: 18.75 m, ~150 passengers split 90/60, 243 kW, 80 km/h, ~15 t.
# Second livery: car 189 (ex-DPP 6668, built 2011, in Most since 12 Sep 2026)
# still in the DPP city red-white, with the two white roof A/C units flanking
# the bellows as on 6668 (photo 2026) and the Prague amber displays.
# Sections 9 + 5 carunits as the DPMHK NB 18 (joint at the real 12.3 m).
# Sprite: original box-model render (vojtechzicha): the dpmhk.py SOR NB 18 body
# on the common SOR base, painted by tools/busrender/sor_town.py. Regenerate
# with tools/busrender/sor_town.py.

