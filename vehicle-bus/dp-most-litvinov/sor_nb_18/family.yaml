# 2009-11, transferred 7/2024 - 9/2026). Two-section fixed consist: front
# section A (driver's cab, 3 doors) + powered rear section B (pusher, Iveco
# Cursor F2B 243 kW, 2 doors); both halves required.
# Repainted from VTPsim's CZR-Praha-SOR_NB_18[1]/[2] in the DPmML
