agency: DPMostLitvinov
type: "NB_12"
copyright: VTPsim

# The source sprites carry the upstream lane placement (their dats use no
# offset), so no extra shift; the default [0, 4] sank them 4 px.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "DPmML"
  agency_cs: "DPmML"
  family_en: "SOR NB 12"
  family_cs: "SOR NB 12"

# SOR NB 12 City — 12-metre rigid diesel city bus from SOR Libchavy, 51 units
# (45 new-built 2012–2017 + 6 ex-DP Praha); replaces the former `nbg_12`
# family (Most never ran the CNG NBG 12).
# Source PNG uses cols 1–8 (col 0 stacked extras dropped); the roof fairing of
# the upstream sheet was replaced with the plain NB 12 roof (from VTPsim's
# Praha SOR_NB_12, same geometry) plus a small white A/C unit behind the
# front, matching the SOR NB 18. Placement and glass unchanged. The source dat
# had no `length` (engine default 8, which the sprite is drawn for).

vehicles:
  - id: "NB_12"
    display_id: "NB 12"
    role_en: "bus"
    role_cs: "autobus"
    row: 0
    head: true
    tail: true
    prev: []
    next: []
    fields:
      cost: 730546
      payload: 92
      speed: 80
      weight: 11
      runningcost: 18
      fixed_cost: 92
      intro_year: 2014
      intro_month: 5
      retire_year: 2050
      retire_month: 1
      waytype: road
      freight: Passagiere
      length: 8
      engine_type: diesel
      power: 213
      gear: 54
      smoke: Diesel_small

liveries:
