# SOR NB 12 City — 12-metre rigid diesel city bus from SOR Libchavy, 51 units
# (45 new-built 2012–2017 + 6 ex-DP Praha); replaces the former `nbg_12`
# family (Most never ran the CNG NBG 12).
# Livery: DPmML white with the yellow skirt line, a small white A/C unit
# behind the front, green LED displays; the ex-Prague front (red lower front,
# the black band under the windscreen with yellow corners), the yellow frame
# round the rear window over the red bumper.
# Second livery: car 83 (ex-DPP 3574, built 2009, in Most since 10/2024) in the
# DPP city red-white (Most colours 2024-26, back in the city scheme since
# 2026), with its white roof A/C unit behind the front and the displays green
# LED as on 83 in Most (photos 2025).
# Sprite: original box-model render (vojtechzicha): the dpmhk.py SOR NB 12 body
# on the common SOR base, painted by tools/busrender/sor_town.py. Regenerate
# with tools/busrender/sor_town.py.

