# (pidcervenomodrobila).
# Sprite: original box-model render (vojtechzicha): SorCN of iredo_models.py
# (with the roof of odis.OSorCN12) painted in the PID liveries of
# tools/busrender/pid.py.
# Regenerate with tools/busrender/pid.py (family.yaml: --yaml).

