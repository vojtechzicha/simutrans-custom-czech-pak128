# SOR NS 12 electric, DPMO 501 (12 m, 3 doors 2-2-2, 33 seats / ~85 total,
# 160 kW asynchronous motor, roof NMC battery, 80 km/h, 12.35 t).
# DPMO scheme: white roof with battery and A/C pods, black window band, red
# A-pillar trim round the black front section, white band, red stripe over the
# navy skirt; black front mask, silver strip and navy bumper.
# Sprite: original box-model render (vojtechzicha): the dpmhk.py SOR NS 12 body
