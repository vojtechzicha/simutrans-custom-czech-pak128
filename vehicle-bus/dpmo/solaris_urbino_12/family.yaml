# The source sprites carry the upstream lane placement (their dats use no
# offset), so no extra shift; the default [0, 4] would sink them 4 px.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "DPMO"
  agency_cs: "DPMO"
  family_en: "Solaris Urbino 12"
  family_cs: "Solaris Urbino 12"

# Solaris Urbino 12 II/III (same body at this scale), DPMO 615-618 (II, 2005) and
# 619-644 (III, 2006-2014). Sprite: the pak128_czr Olomouc object in the DPMO
# scheme, glass converted to lit specials. Of the four II cars, 616-618 run in
# plain lime green (the base left from a former ZOO advert; 615 is plain white):
# livery `zelena`, recoloured from the DPMO sheet (body, stripes, roof -> green).

