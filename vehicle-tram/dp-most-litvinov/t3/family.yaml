agency: DPMostLitvinov
type: "T3"
copyright: Lubak91

display:
  agency_en: "DPmML"
  agency_cs: "DPmML"
  family_en: "Tatra T3"
  family_cs: "Tatra T3"

# Tatra T3 — classic Czechoslovak high-floor tram, in Most service 1961–2011.
# Source PNG uses non-canonical column order (S,E,SE,SW,N,W,NW,NE); the build
# input PNG here is remapped to the canonical w,nw,n,ne,e,se,s,sw layout so the
# emitted .dat can use the standard row.col indexing.
#
# Constraint structure: a T3 can run solo or be coupled with another T3 (a
# common two-car set). prev/next reference the vehicle itself.

vehicles:
  - id: "T3"
    role_en: "tram car"
    role_cs: "tramvajový vůz"
    row: 0
    head: true
    tail: true
    prev: ["T3"]
    next: ["T3"]
    fields:
      cost: 840000
      payload: 110
      speed: 65
      weight: 16
      runningcost: 24
      fixed_cost: 100
      intro_year: 1961
      intro_month: 1
      retire_year: 2011
      retire_month: 1
      waytype: tram_track
      freight: Passagiere
      length: 11
      engine_type: electric
      power: 160
      gear: 130

liveries:
  - color: mostzlutocervena
    name_en: "Most, yellow-red"
    name_cs: "Most, žluto-červená"
    source: pak128_czr/vehicles-tram/Most/Tatra_T3.png (columns remapped from S/E/SE/SW/N/W/NW/NE to canonical w/nw/n/ne/e/se/s/sw)
