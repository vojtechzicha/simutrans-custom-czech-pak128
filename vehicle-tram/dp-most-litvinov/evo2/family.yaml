agency: DPMostLitvinov
type: "EVO2"
copyright: TommPa9

# The sprites carry their own track placement (same convention as the upstream
# tram art, whose dats use no offset), so no extra shift; [0, 4] would sink them.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "DPmML"
  agency_cs: "DPmML"
  family_en: "Pragoimex EVO2"
  family_cs: "Pragoimex EVO2"

# Pragoimex EVO2 (Krnov; earlier mislabelled "Inekon EVO 2") —
# two-section, six-axle, 100% low-floor unidirectional tram, 3 bogies (two under
# the front section, one under the rear), 21.65-23.4 m, 2.56 m wide. DPmML runs
# 11 cars (320-330); the first EVO2 carried passengers on 3 Feb 2020 and six
# more (tender won by Pragoimex) were delivered January-May 2026.
# Stats: 6 x 65 kW (two motored bogies under the front section, one under the
# rear), ~137 passengers, ~28 t empty (the Brno EVO2 figures scaled to Most's
# cars; DPmML publishes no per-car data). Doors on the right side only (single door behind
# the cab + double door on the front section, two double doors on the rear).
# Livery (Most yellow-red): red cantrail band along the roof edge, yellow strip
# above the black-framed window band, yellow lower panel, red skirt; black front
# mask (cap with the LED destination display, wrap-round windscreen, panel
# below it) over a yellow lamp band and a red bumper, red corners on the cap;
# dark grey single-arm pantograph, grey roof equipment.
# Sprite: the real EVO2 body drawn from scratch as a 3D model ray-marched to
# the pak128 projection, shared with the DPMB EVO2 (vehicle-tram/dpmb/evo2) and
# painted in the Most livery. It replaces the upstream pak128_czr Most/EVO2.png
# placeholder, which was the Vario LF2 drawing repainted. Sections are 9 + 7
# length units (the real front section is the longer one) instead of the
# upstream 8 + 8; object names and constraints are unchanged.
#
# Constraint structure: EVO2 (head section) and EVO2b (rear section) must couple
# together, but the pair can also be coupled to additional pairs — EVO2+EVO2b
# +EVO2+EVO2b — so EVO2.prev allows another EVO2b and EVO2b.next allows another
# EVO2.

vehicles:
  - id: "EVO2"
    role_en: "front section"
    role_cs: "přední díl"
    row: 0
    head: true
    tail: false
    prev: ["EVO2b"]
    next: ["EVO2b"]
    fields:
      cost: 38600
      payload: 72
      speed: 65
      weight: 16
      runningcost: 22
      fixed_cost: 91
      intro_year: 2020
      intro_month: 2
      retire_year: 2050
      retire_month: 1
      waytype: schiene_tram
      freight: Passagiere
      length: 9
      engine_type: electric
      power: 260

  - id: "EVO2b"
    display_id: "EVO2"
    role_en: "rear section"
    role_cs: "zadní díl"
    row: 1
    head: false
    tail: true
    prev: ["EVO2"]
    next: ["EVO2"]
    fields:
      cost: 38600
      payload: 65
      speed: 65
      weight: 12
      runningcost: 20
      fixed_cost: 58
      intro_year: 2020
      intro_month: 2
      retire_year: 2050
      retire_month: 1
      waytype: schiene_tram
      freight: Passagiere
      length: 7
      engine_type: electric
      power: 130

liveries:
  - color: mostzlutocervena
    name_en: "Most, yellow-red"
    name_cs: "Most, žluto-červená"
    source: new EVO2 body drawn from scratch (shared with vehicle-tram/dpmb/evo2), Most livery
