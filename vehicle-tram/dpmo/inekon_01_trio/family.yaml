agency: DPOlomouc
type: "01_Trio"
copyright: TommPa9

# The source sprites carry the upstream lane placement (their dats use no
# offset), so no extra shift; the default [0, 4] would sink them 4 px.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "DPMO"
  agency_cs: "DPMO"
  family_en: "Inekon 01 Trio"
  family_cs: "Inekon 01 Trio"

# Inekon 01 Trio, DPMO 205-207 (2006): 3 sections, the end sections on the two
# bogies and the low-floor centre section suspended between them; single-ended,
# doors on the right only. Sprite: TommPa9's Trio template (as DPO t2001_trio,
# same body/placement as the pak128_czr Olomouc Skoda_03T) repainted into the
# DPMO Trio scheme. Only front + middle + rear builds.

