agency: DPOlomouc
type: "EVO1_o"
copyright: TommPa9

# The source sprites carry the upstream lane placement (their dats use no
# offset), so no extra shift; the default [0, 4] would sink them 4 px.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "DPMO"
  agency_cs: "DPMO"
  family_en: "Pragoimex EVO1/o"
  family_cs: "Pragoimex EVO1/o"

# Pragoimex EVO1/o, DPMO 121-133 (2018-2025): doors on both sides, run
# back-to-back in pairs (second car turned round).
# Sprite: TommPa9's Olomouc EVO1 (a Vario LF body) redrawn into the EVO1
# scheme: red cant band sweeping down at the cab, white strip, white body with
# the red stripe and navy skirt, grey front mask with red lamp pillars.

