  family_cs: "Pragoimex EVO2"

# Pragoimex / TW Team EVO2, nicknamed "Drak" in Brno: two-section, six-axle,
# 100% low-floor unidirectional tram assembled by DPMB from KOS/Pragoimex kits.
# 41 cars (1822-1862) delivered 4/2020 to 1/2026; 1863 is in assembly and up to
# 60 more are on order for 2026-2033. 23.4 m (DPMB), 2.55 m wide, ~3.4 m high;
# 3 bogies (two under the front section, one under the rear), all motored:
# 6 x 65 kW = 390 kW (TAM 1020C). 70 km/h (DPMB), 31.7 t empty, 171 passengers
# (DPMB total; about 49 seated). Doors on the right side only: a single door
# behind the cab and a double door on the front section, two double doors on
# the rear section.
# Livery (DPMB 2020s "Drak" scheme, from the DPMB side drawing and photos):
# white body, red skirt, red cantrail band along the roof edge of both
# sections; at the articulation the red comes down the section ends (front
# section: down into the skirt with a diagonal sweep, a big red "C"; rear
# section: from the band, the skirt starting a metre behind); normal glazing
# in black frames; front: large wrap-round windscreen with a green LED
# destination display, white face with red lamp pods, red bumper, white cap
# with red corners; grey roof equipment, yellow single-arm pantograph.
# Sprites: drawn from scratch as a 3D model ray-marched to the pak128
# projection (replaces the upstream CZR-Brno-EVO2 placeholder, which is the
# Vario LF2 drawing repainted). Sections 9 + 7 units (the real front section is
# the longer one: 12.6 m vs 10.8 m incl. half the bellows), 16 in total like
# the 22.6 m Vario LF2; each section carries half the bellows. Stats: payload,
# weight and power split by section; cost / running / fixed cost are the
# upstream CZR-Brno-EVO2 (= Vario LF2) pair totals scaled by capacity
# (171 / 132) and split by length.

