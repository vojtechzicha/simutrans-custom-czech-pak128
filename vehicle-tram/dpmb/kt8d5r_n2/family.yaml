# Tatra KT8D5R.N2: DPMB's KT8D5 cars (built 1986-93) rebuilt 2002-2014 with a
# new low-floor KOS middle section (ML8LF); 3 sections on 4 motored bogies,
# double-ended, doors on both sides. 31.24 m (DPMB), 2.48 m wide, 38.0 t,
# 8 x 45 kW = 360 kW, 65 km/h, 231 passengers (DPMB). First rebuilt car in
# service autumn 2003. 19 active (1701, 1708-1711, 1714-1716, 1720, 1722-1728,
# 1736-1738), being displaced by the 45T.
#
# Livery: DPMB "unifik" grey-white-red (DPMB/bmhd side-view drawing
# kt8d5r-n2.svg, photo of 1724): light grey roof, dark grey window band with
# light grey door frames, white belt, red lower body, white bottom band; both
# fronts black round the windscreen, white line, red nose with the headlights,
# white lower front.
#
# Sprite: TommPa9's CZR-Brno-Tatra_KT8D5.N2 drawing (identical to the Prague
# KT8D5 sheet), shapes and tile placement unchanged, sections 8 + 5 + 8 as
# upstream (they join). Upstream painted only the leading end grey-red; its
# rear section (CZR-Brno-Tatra_KT8D5.N2c) was the old white-red KT8D5 end, so
# both cab sections are now painted in the same scheme. Glass on the lit-window
# specials, amber LED displays; the rear section keeps its lowered pantograph
# and tail lights. Economy as upstream CZR-Brno-Tatra_KT8D5.N2; capacity and
# weight split 8 : 5 : 8, power on both cab sections as upstream.

