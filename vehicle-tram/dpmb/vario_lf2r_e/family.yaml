# Pragoimex VarioLF2R.E: 2-section articulated, partly low-floor tram on
# three bogies (the rear section carries a small shunting cab), 23.7 m, 2.48 m
# wide, 30.0 t, 6 x 90 kW, 65 km/h, 163 passengers (DPMB). DPMB: 32 active
# (mixed numbers 1069-1132), in service 7 Nov 2008 (1069) to 2018. In Brno it
# also runs with a VarioLFR.E coupled behind, which this pak cannot offer
# (constraints stay inside a family).
#
# Livery: DPMB tram "unifik": light grey roof, dark window band, white line
# under the windows, red band stepping down at the low-floor parts, white skirt
# (bmhd drawing variolf2r-e.svg, DPMB drawing vario_lf2.png, photo of
# 1099 + 1069). bmhd register 9/2026: only 3 cars in unifik, the other 29 in
# all-over adverts, so the base scheme is used.
#
# Sprite: TommPa9's CZR-Brno-Vario_LF2 / _LF2b, shapes and placement unchanged:
# glass on the lit-window specials, green LED displays amber, fixed reds, the
# lowest red row turned white so the skirt reads as in the drawings, roof
# equipment boxes and the white cab air-conditioner added, blue coupler cover
# darkened. Lengths 8 + 8 as upstream (the sections meet at the dark bellows).
# Economy as upstream; capacity, weight and power (270 kW per section) from DPMB.

