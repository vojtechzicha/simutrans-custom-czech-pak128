# Tatra KT8D5N: 7 new-built partly low-floor KT8D5 for Brno (1729-1735),
# delivered December 1998 - December 1999, TV14 IGBT traction; the low-floor
# middle section later inspired the KT8D5R.N2 rebuilds. 3 sections on 4
# motored bogies, double-ended, doors on both sides. 30.3 m body, 2.48 m wide,
# 38.0 t, 8 x 49.3 kW = 394 kW, 65 km/h, 226 passengers (DPMB). All 7 active.
#
# Livery: DPMB "unifik" grey-white-red like the KT8D5R.N2 (photo of 1729):
# light grey roof, dark grey window band, white belt, red lower body, white
# bottom band; fronts black round the windscreen, white line, red nose.
#
# Sprite: the same repainted TommPa9 KT8D5 drawing as vehicle-tram/dpmb/
# kt8d5r_n2 (identical body; sections 8 + 5 + 8, they join). Compromise: the
# real KT8D5N carries two single-arm pantographs, the shared drawing shows the
# R.N2's diamond pantographs. Economy as upstream CZR-Brno-Tatra_KT8D5.N2;
# capacity and weight split 8 : 5 : 8, power on both cab sections.

