# Pars nova / ČKD Tatra K3R-N: DPMB's three-section, partly low-floor tram.
# 1751 and 1752 are Tatra K2s rebuilt by Pars nova in Šumperk (2003-2004) with
# a new low-floor middle section inserted; 1753 and 1754 are complete new
# builds (2006) on the K2 documents. 4 active (1751-1754). 28.25 m body
# (29.35 m over couplers, DPMB), 2.5 m wide, 36.2 t, 4 bogies each with two
# 40 kW motors (TV Progress) = 320 kW, 65 km/h, 54 seated + 142 standing
# (DPMB total 208). Unidirectional, doors on the right only (two 4-leaf doors
# in each end section, one in the middle). First passenger service 11 Feb 2004
# (1751 in regular DPMB service from 1 Jul 2004).
# Livery (DPMB tram "unifik"): light grey roof and cantrail, black window
# band, a white line under the windows that sweeps down at both ends, red
# lower body, white skirt; the middle section's white line dips in a V under
# its low-floor windows. Front and rear: the flat Pars nova (Patrik Kotas)
# fibreglass masks: red U-frame round the windscreen, light grey strip, black
# band, white lamp strip, red apron, white bumper. Single-arm pantograph and a
# white air-conditioning unit over the cab.
# Sprites: redrawn from scratch as a 3D model rendered to the pak128.cs
# projection (replaces the upstream CZR-Brno-Tatra_KT3RN placeholder, whose end
# sections are TommPa9's K2 ends with the round K2 fronts). Section lengths
# 8 + 5 + 8 like the upstream KT3RN / KT8D5 (the K3R-N is close to a KT8D5 in
# length); each end section carries the whole bellows at its inner end, the
# feature layout follows the DPMB side drawing (k3rn.png). The section
# placement in the tile follows the native pak128.cs trams.
# Economy: the upstream CZR-Brno-Tatra_KT3RN fields (cost, running and fixed
# cost); power split over the two motored end sections like upstream.

