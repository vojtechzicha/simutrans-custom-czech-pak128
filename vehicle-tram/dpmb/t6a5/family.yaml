  family_cs: "Tatra T6A5"

# ČKD Tatra T6A5, high-floor 4-axle unidirectional tram: 15.64 m, 2.5 m wide,
# 19.5 t, 4 x 47 kW, 65 km/h, 117 passengers (DPMB). DPMB runs 30: the 21
# Brno-built ČKD DS cars 1201-1220 and 1235 (in service from 28 Feb 1996) and 9
# ex-Praha cars bought 2019-20 (1224-1246 with gaps; 1239/1240 stored 1/2026,
# several scrapped 2024-25). Normally worked as 2-car sets, the second car with
# its pantograph down (e.g. 1209 + 1210); solo running is possible.
#
# Livery: DPMB tram "unifik" (bmhd register: 12 of the 20 active DS cars; the
# ex-Praha cars still wear the similar "schéma T6A5" with light-grey instead
# of dark pillars, the rest carry adverts). From the DPMB drawing t6a5.png
# and photos of 1209, 1211 and 1215: white roof and roof edge, dark grey window
# band and windscreen mask, white line under the windows, red lower body,
# white skirt.
#
# Sprite: TommPa9's CZR-Brno-Tatra_T6A5 / _T6A5b (pantograph up / down), shapes
# and placement unchanged, repainted: fixed paint instead of the grey roof and
# the dark sill line (now the white line), glass on the lit-window specials,
# the missing white skirt of the east view added. Lengths 12 + 12 as upstream
# (the drawn bodies meet with a coupler gap). Economy as upstream; capacity,
# power and weight from DPMB; retirement brought forward (type being run down).

