agency: DPBrno
type: "T3R.PV"
# The sprites keep the upstream pak128_czr T3 placement (their dats use no
# offset), so no extra shift.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true
copyright: Lubak91

display:
  agency_en: "DPMB"
  agency_cs: "DPMB"
  family_en: "Pragoimex T3R.PV"
  family_cs: "Pragoimex T3R.PV"

# Pragoimex T3R.PV: a new high-floor VarCB3 body (Pragoimex / KOS Krnov) with
# the classic Kardaus T3 masks and TV Progress traction, registered as a
# rebuilt T3. 14.0 m body (15.1 m over couplers, same as a T3), 2.5 m wide,
# 16.0 t, 4 x 47 kW, 65 km/h, 23 seated + 87 standing = 110 (DPMB). Brno cars
# have a single-arm pantograph and a driver's-cab air conditioner on the front
# roof dome. DPMB: 1517, 1558, 1561, 1603, 1655, 1657, 1658 (7 active, all at
# Pisárky; 1653, 1654 and 1656 scrapped 2025-26); first in service 22 Feb
# 2003. Runs solo or in 2-car sets (e.g. 1603 + 1561).
#
# Livery: DPMB tram "unifik" scheme: light grey roof, dark grey window band
# (cantrail, pillars and the mask round the windscreen), a white line under
# the windows, red lower body, white skirt; red nose with round headlamps and a
# black bumper on the front. Shared with the T3R.EV (vehicle-tram/dpmb/t3r_ev).
#
# Sprite: Lubak91's T3R.P drawing (pak128_czr Praha Tatra_T3.png, the same body
# as TommPa9's Pragoimex_T3RP sheet but shaded) with the single-arm pantograph
# of Lubak91's Brno T3R sheet; repainted from the bmhd side drawing t3r-pv.svg
# and photos (1603, 1569), glass on the lit-window specials, amber LED
# destination displays, white cab A/C box on the front roof dome.
# Economy scaled from CZR-Brno-Tatra_T3R (840 000 / 24 / 100, gear 130) with the
# stronger 4 x 47 kW traction. Being run down (3 of 10 scrapped), hence the
# early retirement.

vehicles:
  - id: "T3R.PV"
    role_en: "tram car"
    role_cs: "tramvajový vůz"
    row: 0
    head: true                 # runs solo ...
    tail: true
    # 2-car sets with any Brno T3 variant (e.g. T3G + T3R), as upstream allowed
    prev: ["T3R.PV", "t3g/T3G", "t3r/T3R", "t3r_ev/T3R.EV"]
    next: ["T3R.PV", "t3g/T3G", "t3r/T3R", "t3r_ev/T3R.EV"]
    fields:
      cost: 880000
      payload: 110
      speed: 65
      weight: 16
      runningcost: 24
      fixed_cost: 100
      intro_year: 2003
      intro_month: 2
      retire_year: 2032
      retire_month: 1
      waytype: schiene_tram
      freight: Passagiere
      length: 11
      engine_type: electric
      power: 188
      gear: 130

liveries:
  - color: dpmbsedobilocervena
    name_en: "DPMB grey-white-red"
    name_cs: "DPMB šedo-bílo-červená"
