# Tatra T3R.PLF (Pragoimex / KOS), PMDP 315-332 (2008-10): partly low-floor
# T3 rebuilds, 15.1 m, 21.5 t, 22 seated + 105 standing, 4 x 40 kW, 65 km/h. Fixed
# pairs 315+316 ... 331+332, solo at weekends and in the evening.
# Sprite: the car has the VarCB3LF body of the Vario LF (flush dark glazing band,
# yellow up to the roof, the white stripe dipping at the low-floor middle) with
# the classic rounded T3 (Kardaus) ends (photo of 325 + 326, plzensketramvaje.cz).
# So the body is TommPa9's Vario drawing (the VZ PMDP VarioLFR.S sheet) and both
# end caps come from Lubak91's T3 drawing (the VZ Prague T3R.PLF sheet, repainted
# PMDP, grey roof taken to the Vario's yellow), fitted per view onto the Vario ends.

