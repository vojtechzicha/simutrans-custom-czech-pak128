# Tatra T3R.PLF (Pragoimex / KOS), PMDP 315-332 (2008-10): partly low-floor
# T3 rebuilds, 15.1 m, 21.5 t, 22 seated + 105 standing, 4 x 40 kW, 65 km/h. Fixed
# pairs 315+316 ... 331+332, solo at weekends and in the evening.
# Sprite: the VZ Prague T3R.PLF sheet (Lubak91's T3 drawing lengthened to the
# PLF) with the single-arm pantograph of Lubak91's Brno T3R.PV drawing, as the
# Plzeň cars carry (the Prague ones keep a diamond).
# Livery: PMDP "žluto-šedo-bílá" (yellow-grey-white), recoloured zone by zone
# from the base sheet with its shading kept (colour class + position against
# the window band in each column), no shapes changed.
# Roof light grey, grey window band, yellow lower body, white stripe above the
# yellow skirt.

