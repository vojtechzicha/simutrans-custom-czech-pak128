# Škoda 40T ForCity Smart, PMDP Plzeň's bidirectional low-floor tram: 22 cars
# 385-406 (40T0 385-386, 40T1 387-396, 40T2 397-406), 2021-2025; the
# sub-series look the same at sprite scale, so one object set covers all
# three. 29.14 m, 2.50 m wide, 3.57 m high, 3 sections, 100 % low floor,
# 4 bogies (one under each end section, two under the middle section, not
# under the joints), identical cabs at both ends with a narrow, rounded front
# (the wide double door behind each cab forces it), 5 double doors on each
# side (2 on each end section, 1 in the middle). 45.77 t empty, 64 seated +
# 121 standing, 8 x 70 kW = 560 kW, 70 km/h. Always runs solo.
# Livery (PMDP yellow, as on the 40T): all yellow including the roof; black cab
# cap and windscreen surround; black flush glazing band with a thin white line
# under it that runs across both fronts; yellow lower body; yellow-framed
# doors with dark glass; light-grey lower edge and bogie fairings; grey
# bellows; orange LED destination displays; yellow single-arm pantograph
# on the front cab section only: the real car has one (photo of 399).
# Sprites: original 3D model rendered to the pak128.cs projection, adapted
# from the Brno 45T model (same renderer, heights and per-direction front
# anchor). Sections 7 + 8 + 7 units (1 unit = 1.325 m): the middle body is
# ~1.2 x an end section on side-on photos (cars 385, 399). Each cab section
# carries the full grey bellows at its joint end; every section's front sits
# at the same per-direction point, so the joints close in all 8 directions.
# The rear cab section has its own row (tail lights, no pantograph)
# instead of reverse: true.
# Economy: the 45T's per-convoy totals scaled by length (29.14 / 31.0).

