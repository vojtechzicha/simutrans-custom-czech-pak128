# Tatra KT8D5R.N2P, PMDP 288-296, 298, 299: KT8D5 of 1989 rebuilt by KOS
# 2006-09 with a low-floor middle section; 30.3 m, 42 t, 56 seated + 171
# standing, 8 x 45 kW, 65 km/h. Double-ended, always solo.
# Sprite: TommPa9's KT8D5.RN2P (the VZ Prague sheet in its original red-white-
# grey, whose belt and skirt map onto the Plzeň scheme).
# Livery: PMDP "žluto-šedo-bílá" (yellow-grey-white), recoloured zone by zone
# from the base sheet with its shading kept (colour class + position against
# the window band in each column), no shapes changed.
# Light grey roof, mid-grey window band round the windscreens, yellow lower
# body and doors, a white stripe above the yellow skirt. The pantograph stays
# dark grey as drawn (yellow on the real cars).

