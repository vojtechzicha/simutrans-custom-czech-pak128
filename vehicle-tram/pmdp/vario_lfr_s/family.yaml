agency: PMDP
type: "VarioLFR.S"
image_offset: [0, 0]       # sprites carry their own placement (upstream convention)
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true
copyright: TommPa9

display:
  agency_en: "PMDP"
  agency_cs: "PMDP"
  family_en: "Pragoimex VarioLFR.S / VarioLF plus"
  family_cs: "Pragoimex VarioLFR.S / VarioLF plus"

# Pragoimex VarioLFR.S, PMDP 333-335, 338-353, 356-360, 364, 365 (2010-14), and
# the VarioLF plus 336, 337, 354, 355, 367, 368 (2011-17): the same Vario body
# and Pelikán front at this scale (one object, both names in the display
# string). 15.1 m, about 32 seated + 84 standing, 65 km/h; pairs within the
# type, solo at weekends.
# Sprite: TommPa9's Vario (the VZ Brno VarioLFR.E sheet: cab A/C and roof boxes).
# Livery: PMDP "žluto-šedo-bílá" (yellow-grey-white), recoloured zone by zone
# from the base sheet with its shading kept (colour class + position against
# the window band in each column), no shapes changed.
# Yellow roof and body, black glazing, a dark-grey line under the windows, the
# white stripe dipping at the low-floor middle.

vehicles:
  - id: "VarioLFR.S"
    role_en: "tram car"
    role_cs: "tramvajový vůz"
    row: 0
    head: true                 # runs solo ...
