agency: DPOstrava
type: "T3"
# Sprites were extracted from the compiled upstream pak with their tile
# placement baked in, so no extra shift (the default [0, 4] sank them 4 px).
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true
copyright: Lubak91

display:
  agency_en: "DPO"
  agency_cs: "DPO"
  family_en: "Tatra T3R.P"
  family_cs: "Tatra T3R.P"

# Auto-extracted from CZ-vehicle-tram.pak via tools/pak_extract.py families.
# Numeric fields come from the upstream VHCL payload; service dates were
# checked against the 2025–2026 DPO roster.
# The modernised T3R.P, the T3 that still runs in Ostrava in 2026 (10 cars, in
# pairs). id and type stay "T3" so the object name VZ-DPOstrava-T3-dpomodrozluta-T3
# (and savegames using it) is unchanged. The classic unmodernised look is the
# separate family t3sucs.
# Sprite: Lubak91's T3 sheet (frozen in tools/tramrender/src/dpo/) patched by
# tools/tramrender/dpo_tatra.py: yellow single-arm pantograph (TommPa9's T6A5
# one) about 1/3 back, light-grey A/C box at the front of the roof (photos 983, 994; AC_PODS switch,
# pending the owner's review),
# black LED destination panel, FFFF53 headlights, FF211D tail lights, plain cab
# glass, no brown strip across the window tops; ne / sw moved onto the DPO front
# anchor so a pair at length 11 meets.

vehicles:
  - id: "T3"
    # original pak name: CZ-Ostrava-T3
    role_en: "tram car"
    role_cs: "tramvajový vůz"
    row: 0
    head: false
    tail: false
    fields:
      cost: 840000
      payload: 110
      speed: 65
      weight: 16
      runningcost: 24
      fixed_cost: 100
      intro_year: 1962
      intro_month: 1
      retire_year: 2030
      retire_month: 1
      waytype: schiene_tram
      freight: Passagiere
      length: 11
      engine_type: electric
      power: 160
      gear: 130

liveries:
  - color: dpomodrozluta
    name_en: "DPO blue-yellow"
    name_cs: "DPO modro-žlutá"
