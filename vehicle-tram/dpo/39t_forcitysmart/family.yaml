# Škoda 39T ForCity Smart Ostrava (Artic-based), 38 cars 1751-1788 delivered
# 2021-2024, all in service. Real car: 26.6 m, 2 sections on 2'Bo'Bo' (front
# section on one bogie, rear on two), 100 % low floor, unidirectional, 5 double
# doors on the right side only (3 + 2), 60 seated + 140 standing, 4 x 100 kW,
# 80 km/h, 36.8 t.
# Sections 10 + 8 carunits: the joint sits ~14.3 m behind the nose (perspective
# fit on photos of 1753, 1766, 1768), rear section ~12.3 m. Payload, weight and
# costs are the car's totals split by length.
# Sprites: original model rendered by tools/tramrender/dpo_39t.py on the field
# raymarcher (fieldrender.py): rounded nose with raked windscreen, black mask
# and cap, LED headlights, rounded roof shoulders, DPO palette from
# tools/tramrender/dpo_palette.py (turquoise body, sunlit turquoise roof).
# Each section is drawn complete from the front anchor of the native DPO trams.

