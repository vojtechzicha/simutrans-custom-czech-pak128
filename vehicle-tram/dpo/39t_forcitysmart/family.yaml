# Škoda 39T ForCity Smart Ostrava (Artic-based), 38 cars delivered 2021–2024,
# all in service. Real car: 26.5 m, 100 % low floor, unidirectional (4 double
# doors on the right), 60 seated + 140 standing, 4 × 100 kW, 80 km/h, 36.8 t.
# Modelled as the two visible bodies: an 18 m cab section (12 carunits) and a
# 9 m rear section (6 carunits). Sprite drawn from scratch from photos of cars
# 1753/1755 (box model rendered in the pak128 projection): DPO turquoise, tall
# black glass band, white sill line sweeping down under the black cab mask,
# white-framed black doors, silver bellows; placed on the footprint of the
# upstream DPO trams.

