# Auto-extracted from CZ-vehicle-tram.pak via tools/pak_extract.py families.
# Numeric fields come from the upstream VHCL payload; service dates were
# checked against the 2025–2026 DPO roster.

# Sprites: TommPa9's blue-yellow sheet (frozen in tools/tramrender/src/dpo/),
# patched by tools/tramrender/dpo_tatra.py to the one-way Ostrava cars: yellow
# single-arm pantograph (his T6A5 one) about 1/3 back on the front section, a
# light-grey A/C pod over the cab (dpo_tatra.py AC_PODS / --no-ac; pending the
# owner's review), plain cab glass, lit FFFF53 headlights, and the
# rear section's end redrawn as the saloon end (rear window, orange-over-red
# lamps, bumper with reflectors, no headlights).
# Turquoise (DPO "modrá s bílým proužkem", the current scheme on 1503-1505): a
# zone-map repaint of the patched blue-yellow sheet in the palette of
# tools/tramrender/dpo_palette.py: turquoise body, sunlit-tint roof, black
# window band, cab mask and doors, one white line under the band that follows
# the middle section's V-dip and runs across the front under the windscreen.

