  family_cs: "Tatra T3M.2-DVC"

# Tatra T3M.2-DVC: 18 new T3SUCS-type bodies bought by DPP in 1996 and fitted
# with the thyristor TV1 equipment of worn-out T3M cars ("DVC" = dveře volí
# cestující, passenger-operated doors). 15.1 m over couplers, 2.5 m wide,
# 16.96 t, 4 x 40 kW, 65 km/h, 20 seated + 85 standing = 105 (DPP). 8 left in
# Sep 2026 (8015, 8051, 8074, 8077, 8080, 8083, 8088, 8089), all at
# Hloubětín and all in 2-car sets; being withdrawn quickly (gone by ~2027).
#
# Livery: DPP red-cream like the T3R.P (cream roof ends, pillars and skirt, red
# belt and nose, black bumper). Differences from the T3R.P (photos of 8063,
# 8083): the old illuminated line-number box (blue plate) on the front dome
# instead of the LED panel, paper destination board low in the windscreen, no
# side LED display, no cab air-conditioner, and the grey brake-resistor box of
# the T3M on the rear part of the roof.
#
# Sprite: the VZ T3R.P sheet (Lubak91's shaded T3 drawing, as the native
# CZR-Praha-Tatra_T3M.2 reused it) with those details redrawn. Economy as
# upstream CZR-Praha-Tatra_T3M.2.

