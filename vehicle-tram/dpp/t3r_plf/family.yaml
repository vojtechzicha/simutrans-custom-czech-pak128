agency: DPPraha
type: "T3R.PLF"
# The sprites keep the upstream pak128_czr T3 placement (their dats use no
# offset), so no extra shift.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true
copyright: TommPa9, Lubak91

display:
  agency_en: "DPP"
  agency_cs: "DPP"
  family_en: "Tatra T3R.PLF"
  family_cs: "Tatra T3R.PLF"

# Tatra T3R.PLF (Pragoimex / KOS Krnov new build): a partly low-floor T3 with
# a VarCB3LF body, a lowered middle section between the bogies ("wana") with
# the low-floor middle door, classic Kardaus T3 cab masks at the front and TV
# Progress IGBT traction. About 1 m longer than a T3: 16.2 m over couplers
# (15.1 m body), 2.48 m wide, 19.7 t, 4 x 40 kW (DPP), 65 km/h, 22 seated + 75
# standing (DPP). Prague cars carry a classic diamond pantograph (other cities
# use a single-arm one). Nos. 8251-8299 and 8751-8790: 89 active in Sep 2026,
# still being delivered (about 11 left on the 2020 contract for 65). First car
# with DPP from 9 Feb 2007 (8251). Runs solo or as a 2-car set (often led by a
# PLF with a T3R.P behind; here PLF + PLF only).
#
# Liveries: red-cream (74 cars; cream roof ends / window pillars / skirt, red
# belt that dips lower at the low-floor middle, red nose on the cream mask) and
# the original 2006-2010 wine-silver (15 cars: 8255, 8260, 8264, 8265, 8269,
# 8272, 8273, 8275-8279, 8281-8283; burgundy lower body with silver fan stripes
# around the middle, silver roof, window band and skirt, silver front with a
# burgundy lobe round each headlamp meeting in a V).
#
# Sprite: the car has the VarCB3LF body of the Vario LF (tall windows, the red
# belt dipping at the low-floor middle) with the classic T3 (Kardaus) ends and
# a diamond pantograph (photos of 8284, 8277). So the body is TommPa9's Vario
# drawing (the VZ Brno VarioLFR.E sheet) painted like the classic T3R.P in each
# DPP scheme (grey roof with a light rim, light band and pillars round the
# windows, red / wine lower body, light skirt; every colour one of the T3R.P
# sheet's own shades), with both
# end caps and the diamond pantograph from Lubak91's T3 drawing (the previous
# sheet of this family, same livery), fitted per view; each view then placed
# where the previous drawing sat, so pairs with a T3R.P still meet.
# Economy scaled from CZR-Praha-Tatra_T3RP (840 000 / 24 / 100, gear 130):
# a newer, longer low-floor car at the same 4 x 40 kW.

vehicles:
  - id: "T3R.PLF"
    role_en: "tram car"
    role_cs: "tramvajový vůz"
    row: 0
    head: true                 # runs solo ...
    tail: true
    # 2-car sets with any Prague T3 rebuild of the same livery (e.g. T3R.PLF + T3R.P), as DPP runs them
    prev: ["T3R.PLF", "t3r_p/T3R.P", "t3r_pv/T3R.PV", "t3m2_dvc/T3M.2-DVC"]
    next: ["T3R.PLF", "t3r_p/T3R.P", "t3r_pv/T3R.PV", "t3m2_dvc/T3M.2-DVC"]
    couple_liveries: true      # red-cream + wine-silver pairs run in Prague
    couple_sibling_liveries: true
    fields:
      cost: 960000
      payload: 97
      speed: 65
      weight: 20
      runningcost: 25
      fixed_cost: 109
      intro_year: 2007
      intro_month: 2
      retire_year: 2060
      retire_month: 1
      waytype: schiene_tram
      freight: Passagiere
      length: 12
      engine_type: electric
      power: 160
      gear: 130

liveries:
  - color: dppcervenokremova
    name_en: "DPP red-cream"
    name_cs: "DPP červeno-krémová"
  - color: dppvinovostribrna
    name_en: "DPP wine-silver"
    name_cs: "DPP vínovo-stříbrná"
