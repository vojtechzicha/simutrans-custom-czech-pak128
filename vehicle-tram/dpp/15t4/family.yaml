  family_en: "Škoda 15T4 ForCity Alfa"
  family_cs: "Škoda 15T4 ForCity Alfa"

# Škoda 15T4 / 15T5 / 15T6 / 15T7 ForCity Alfa: the later Prague batches of
# the 15T with the redesigned front, passenger air conditioning and a new
# paint scheme. Same body and running gear as the 15T0-3: 3 sections, 31.4 m
# x 2.46 m x 3.45 m, 43.8 t, 16 x 46.6 kW, 60 seated + 139 standing = 199,
# 60 km/h (DPP). DPP nos. 9326-9450, 125 active in Sep 2026; first car (9326)
# presented 24 Aug 2015, deliveries to Feb 2019. 51 carry full-body adverts.
#
# Livery "bílo-červená se žlutým čelem" (photos of 9328, 9342, 9389, 9440):
# black upper body and window band, silver roof-edge line, WHITE band below
# the windows interrupted by the doors, red skirt; front: black windscreen in a
# yellow outline, a yellow panel between the headlights under the windscreen,
# a white band and a red lower front. The rear end has no yellow (black mask,
# white band, red; photo of 9389).
#
# Sprite: TommPa9's pak128_czr Skoda_15T4 sheet (front section, with the yellow
# outline) plus the Skoda_15T middle and rear sections, whose silver band the
# upstream 15T4 wrongly reuses - repainted white here; yellow panel added under
# the windscreen, glass moved to the lit-window specials, lit red displays
# turned into amber LED displays. Lengths 8 + 7 + 8 as upstream.
# Economy as upstream CZR-Praha-Skoda_15T4; capacity and weight are the DPP
# figures split over the sections by length.

