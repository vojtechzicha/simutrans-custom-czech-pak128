# Škoda 14T "Elektra" (Porsche Design), 5-section single-ended tram, partly
# low-floor: 30.25 m x 2.46 m, 39.99 t empty (DPP), 6 x 90 kW = 540 kW,
# 69 seated + 131 standing = 200 (DPP). Sections 1, 3 and 5 sit on bogies,
# 2 and 4 hang between them; doors on the right side (1 behind the cab, 2 in
# each of sections 2 and 4). 60 built 2005-2009, in Prague service from 2006
# (first cars January 2006); 55 left (9114-9172 with gaps, all at Kobylisy).
# The periodic overhaul (first car 9136, March 2026) brings a yellow single-arm
# pantograph, orange LED displays, lacquered PID paint and 70 km/h; 70 km/h is
# used for both liveries (upstream CZR-Praha-Skoda_14T also has 70).
#
# Liveries:
# - PID grey-red (14 cars so far, rising; repaints since 2023). From photos of
#   9150, 9158 and 9121, which correct the research note that only sections 2
#   and 4 carry red: very light grey body, black glazing band; full-height red
#   blocks (red lower panel + red roof fairing) on section 1 over the door and
#   front window behind the cab (its rear window keeps a grey "pid" panel), on
#   sections 2 and 4 over the window between their two doors, and on section 5
#   over its rear windows; section 3 is all grey. Front: light grey cap, black
#   windscreen with an orange LED display, light grey nose with one red stripe
#   on the tram's left half (observer's right) carrying the left headlights;
#   the rear end repeats it.
# - DPP silver-red-black, as delivered (41 cars): silver body, red skirt, black
#   window band, thin red line along the roof edge, red front bumper (photo of
#   9126).
#
# Sprite: TommPa9's CZR-Praha-Skoda_14T (4 drawn rows, sections 2 and 4 share
# one row), shapes and tile placement unchanged, repainted: fixed paint only,
# source glass converted to the lit-window specials, green display pixels
# turned amber, yellow pantograph warmed. Lengths 4 + 5 + 3 + 5 + 4 as
# upstream (they join). Economy as upstream CZR-Praha-Skoda_14T; capacity and
# weight split over the sections by length.

