agency: DPPraha
type: "15T"
# The sprites keep the upstream pak128_czr placement (the source dat uses no
# offset), so no extra shift.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true
copyright: TommPa9

display:
  agency_en: "DPP"
  agency_cs: "DPP"
  family_en: "Škoda 15T ForCity Alfa"
  family_cs: "Škoda 15T ForCity Alfa"

# Škoda 15T ForCity Alfa, 1st generation (subtypes 15T0, 15T1, 15T2, 15T3,
# 15T3B): 3-section, single-ended, 100 % low-floor tram on four pivoting
# bogies (two Jacobs bogies under the joints). 31.4 m x 2.46 m x 3.45 m,
# 43.8 t, 16 x 46.6 kW synchronous wheel motors, 60 seated + 139 standing =
# 199, 60 km/h in Prague service (DPP). DPP nos. 9201-9325 (9256 missing),
# 124 active in Sep 2026; first car in regular service 5 Feb 2011 (9212, line
# 18). 70 cars carry full-body adverts; the rest wear the delivery scheme.
#
# Livery "stříbrno-červená" (photo of 9300): black upper body and window band,
# silver/white roof-edge line, silver band below the windows interrupted by
# the doors, red skirt; each double door is dark glass down to the skirt with
# a red line where the leaves meet; black windscreen in a red outline, silver
# headlight band and red lower front; grey bellows at the joints.
#
# Sprite: TommPa9's pak128_czr Skoda_15T sheet (the art of the native
# CZR-Praha-Skoda_15T), shapes and placement unchanged: the medium-grey band
# repainted true silver, source glass moved to the lit-window specials, the red
# lit front/rear destination displays turned into amber LED displays.
# Lengths 8 + 7 + 8 as upstream (the joints close in all 8 directions).
# Economy as upstream CZR-Praha-Skoda_15T; capacity and weight are the DPP
# figures split over the sections by length.

