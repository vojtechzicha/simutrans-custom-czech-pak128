agency: DPPraha
type: "52T"
# The sprites carry the upstream pak128.cs tram placement (front anchored where
# the native Škoda 14T/15T sections sit on the track), so no extra shift.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true
copyright: TommPa9

display:
  agency_en: "DPP"
  agency_cs: "DPP"
  family_en: "Škoda 52T ForCity Plus"
  family_cs: "Škoda 52T ForCity Plus"

# Škoda 52T ForCity Plus Praha: 5-section, single-ended, 100 % low-floor tram,
# 31.99 m x 2.50 m, 48.0 t empty, 70 seated + 173 standing (5/m2) = 243, 70 km/h
# in service. 4 powered bogies (2 pivoting under the end sections 1 and 5, 2
# partly pivoting under the short sections 2 and 4); section 3 hangs between
# them. 5 double doors on the right side only (2 in section 1, 1 in section 3,
# 2 in section 5). Regular service from 3 Nov 2025 (line 12); nos. 9501-9531
# so far (30 active Sep 2026), 96 ordered under a framework for up to 200.
# Traction power is not published (8 asynchronous motors, 2 per bogie):
# 8 x 60 kW = 480 kW is an ASSUMED stand-in, not an official figure.
#
# PID livery as delivered (photos of 9503/9506; differs from the 2024 design
# render): light grey body with full-height red blocks (red lower panel + red
# roof fairing) on the rear half of section 1, all of section 3 and the front
# half of section 5; continuous black glazing band; black upper front mask
# (roof cap, windscreen, headlight band) over a light grey lower front with one
# red rectangle right of centre; the rear end repeats the scheme with tail
# lights; dark single-arm pantograph behind the cab.
#
# Sprite: drawn new (no 52T exists upstream) with a box model rendered in the
# pak128 projection. Section lengths follow the Škoda side drawing (9.4 + 4.4 +
# 4.5 + 4.4 + 9.4 m -> 7 + 3 + 3 + 3 + 7 carunits = 23, like the 31.4 m 15T's
# 8 + 7 + 8); every section is drawn exactly its own length from the front
# anchor of TommPa9's native Škoda 14T/15T sections (hence the credit), body
# height/width matched to the 15T. Economy scaled from CZR-Praha-Skoda_15T by
# capacity (243 / 210) and split over the sections by length.

