  family_cs: "Stadler Regio-Shuttle RS1"

# Stadler Regio-Shuttle RS1, DB class 650.7 (650 701-738), of agilis: 38 built
# 2010-12 for the Dieselnetz Oberfranken (service from June 2011 / Dec 2012),
# the same late RS1 generation as the ČD 840/841: 2 × 265 kW Iveco, 120 km/h,
# 25.5 m, about 43 t, UIC screw coupler with side buffers (photos below).
# On Czech track in 2026: RB 95/96 Hof - Selb-Plößberg - Aš - Cheb -
# Marktredwitz and the Os 172xx locals Cheb - Františkovy Lázně - Aš - Aš město
# (vagonWEB 2026); 650 702 photographed at Aš.
#
# Livery agilis (research ops/de_at_operators.md B; photos 03.07.19 Hof Hbf
# 650735, Aš vlak na nádraží 650 702, Hochstadt-Marktzeuln 650 716,
# Burgkunstadt 650 706): silver-grey body and roof; the cab section from the
# front to just behind the driver's side window in dark anthracite, with the
# lime "pixel flight" dots; lime doors and a lime band low on the side wall
# (the research said the whole lower half is dark: Hof and Hochstadt show it
# silver above the lime band, only the cab section is dark); dark front with a
# lime frame round the black windscreen and a lime panel carrying the
# headlights, dark lower front with the buffers; grey "agilis" high on the
# middle section.
#
# Sheet: the ČD 840 body, pak128.CS CD_840 by Lubak91 (vehicle.motorak.840_841
# row 1), zone-map repainted with the ČD p2 zone painter (one-off painter
# script, not in the repo; the same script paints the die-landerbahn/650
# sheets). Roof A/C pods lengthened
# to about 5.5 m (door to the far end of the next section, 650 716 Hochstadt;
# the ČD 840's end halfway), upper headlight of the German three-light code
# lit, windscreen and driver's side windows plain dark glass, no yellow ČD
# buffer-beam edge, door leaves in the door colour with a glass centre line.
# One row, length 12 like the ČD 840.

