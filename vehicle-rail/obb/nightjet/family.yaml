agency: OBB
type: "Nightjet"
copyright: vojtechzicha      # original art, rendered from a box model
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "ÖBB"
  agency_cs: "ÖBB"
  family_en: "Nightjet"
  family_cs: "Nightjet"

# ÖBB Nightjet classic night-train coaches of NJ 456/457 (EN 40456/40457)
# Graz - Wien - Břeclav - Brno - Pardubice - Praha - Ústí n. L. - Děčín -
# Dresden - Berlin, daily, hauled throughout by an ÖBB 1216. All UIC-Z length
# (26.40 m over buffers), 200 km/h, two bogies. Formation 2026 (vagonWEB):
# 1216 + Bcmz 59-91 + 2x WLABmz 72-90 + BTEX Bvcmbz 59-90 + Bcmz 59-91 +
# 2x Bmz 21-91 (the Bmz in Nightjet or ÖBB IC paint, see ../ic).
# - Bcmz 73 81 59-91.1: couchette car, 11 compartments (4/6 berths).
# - WLABmz 61 80 72-90: sleeper (ex-DB, ÖBB-owned, D-registered), entrance
#   at one end only; corridor side with 13 windows, compartment side with six
#   big windows (vagonWEB WLABmz-7290-nj-a/b, photo WLABmz 001 bahnbilder
#   1385292).
# - Bvcmbz 61 80 59-90: couchette car with a wheelchair compartment, leased
#   from BahnTouristikExpress (BTEX); runs in full Nightjet paint (vagonWEB
#   Bvcmbz249-nj, 2026 cars 010/019/022/024/032/044; photo Bvcmbz 010 in
#   NJ 425, bahnbilder 1385293, 26 Jun 2024). Rounded roof ends.
# - Bmz 73 81 21-91: seated compartment car, 66 seats.
#
# Livery "Nightjet" (photos: sunlit Bmz 21-91 152 and Bvcmbz 010, bahnbilder
# 1385290/1385293; Bmz 21-91 177 Bruxelles 2025, Commons; Bcmz at Graz and
# Linz, Commons Nightjet_Graz_Hbf.jpg / Nightjet_Liegewagen.jpg): midnight
# blue body (sunlit #242E75), the red line directly under the windows with a
# thin grey line below it (across the light grey doors too), light grey roof,
# dark grey ends, red ÖBB logo, the big grey outline "nightjet" wordmark and
# the white car-type lettering on the lower body; silver window rims on the
# couchette, sleeper and BTEX cars, dark rubber frames on the Bmz.
# Not shipped: the 2024+ repaint with a black window band (a few Bmz/WLABmz,
# one Bcmz in 2026) - see the painter's report.
#
# Sprites are rendered from a box model: tools/railrender/ops_coaches.py on
# tools/railrender/coachkit.py; regenerate with
# `python tools/railrender/ops_coaches.py nightjet`. Length 13 = 26.4 m.
# Coaches couple with any locomotive or coach (prev/next: any).

