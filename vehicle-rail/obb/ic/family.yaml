agency: OBB
type: "IC"
copyright: vojtechzicha      # original art, rendered from a box model
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "ÖBB"
  agency_cs: "ÖBB"
  family_en: "IC"
  family_cs: "IC"

# ÖBB UIC-Z (Eurofima-derived) InterCity coaches, 26.40 m over buffers,
# 2.825 m wide, 200 km/h, air-conditioned, doors at both ends. On Czech track
# in 2026: two through coaches Graz - Wien - Břeclav - Přerov - Ostrava -
# Bohumín daily in EC 206/207 "Porta Moravica" (switched at Bohumín to IC 306
# to Wrocław), one Bmpz 29-91 + one Bmz 21-91 (vagonWEB 2026 compositions:
# Bmpz 020, 023, 037, 041, 045, 047, 062, 070; Bmz 118-177). Bmz 21-91 in
# this livery also runs as the seated car of NJ 456/457 Graz - Praha - Berlin.
# - Bmpz 73 81 29-91: open 2nd class, 74 seats + 2 wheelchair places, bike
#   space behind pictogram windows at both ends; Jenbacher / SGP 1991-,
#   modernised 2002-08, 50 t.
# - Bmz 73 81 21-91: 11 compartments, 66 seats; in ÖBB service since 1989,
#   92 built, 50 t.
#
# Livery: ÖBB IC "Valousek" scheme (photos: Wien Meidling Bmpz, Commons
# Wien_Meidling_wagon_Bmpz.JPG; ÖBB Bmz at Neunkirchen, Commons
# OBB_Bmz_-_Neunkirchen.jpg; vagonWEB drawings Bmpz-2991-2019, Bmz-2191-1-2019):
# light grey lower body, a mid-grey band round the windows, a white line
# under the red roof, the red stripe along the bottom of the body side (also
# across the doors), red ÖBB wordmark mid-car, dark grey ends with a red
# gangway door (Neunkirchen photo).
#
# Sprites are rendered from a box model: tools/railrender/ops_coaches.py
# (data tables from the vagonWEB side drawings, both sides) on
# tools/railrender/coachkit.py; regenerate with
# `python tools/railrender/ops_coaches.py ic`. Length 13 = 26.4 m, like the
# native pak128.cs coaches. Coaches couple with any locomotive or coach
# (prev/next: any).

vehicles:
  - id: "Bmpz29-91"
    display_id: "Bmpz 29-91"
    role_en: "2nd class open coach"
    role_cs: "velkoprostorový vůz 2. třídy"
    row: 0
    prev: any
    next: any
    fields:
      cost: 2300000
