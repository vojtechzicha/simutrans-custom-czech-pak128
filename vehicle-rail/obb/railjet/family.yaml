# ÖBB railjet (Siemens Viaggio Comfort, 2008-), the seven-car push-pull set with a
# class 1216 (or 1116) at one end and the Afmpz driving trailer at the other:
# 1216 + Bmpvz + 3x Bmpz + ARbmpz + Ampz + Afmpz. In Czechia on RJ / RJX Praha -
# Brno - Břeclav - Wien - Graz / Villach and Praha - Wien.
# ids -1..-7: the locomotive leads, the Afmpz runs at the tail with its cab outward.
# ids -R1..-R7: the same set travelling the other way, Afmpz cab leading and the
# locomotive pushing at the tail; every car is drawn turned round, so asymmetric
# cars (ARbmpz, Ampz, Bmpvz) keep their ends on the right side. Use the 1216's
# "1216-rear" object as the pushing loco: its railjet livery is turned too.
#
# Art: CZR (Lubak91, CZR-vehicles-rail-pass-OeBB.pak), frozen in
# tools/railrender/src/czr_obb_railjet.png. CZR's own set drew the Afmpz cab leading
# in both directions and never turned its reverse cars; the sheet is regenerated with
# `python tools/railrender/obb_railjet.py`, which turns the cars round. Cost,
# capacity, speed, weight and running costs as in the CZR pak (intro 2008/12,
# retire 2048 kept from CZR).

