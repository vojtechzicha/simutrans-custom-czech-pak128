# GW Train Regio 814 501 + 914 501: a RegioNova two-car DMU rebuilt by Pars
# nova in 2007 from M 152.0 85840 and Btax780 85631 for Železnice Desná,
# bought by GWTR in 2017 and in GWTR orange since March 2018. Šumava until
# Dec 2025, since 1 Jan 2026 on the cross-border line Trutnov - Královec -
# Lubawka - Sędzisław. 28.44 m, 39.6 t, 242 kW, 80 km/h, 84 seats; the 914
# has the low-floor centre section.
#
# Each car has its cab at the outer end, so a sprite is only right in one
# convoy position; both orientations are modelled like the ČD 814.0 family:
#   [914.5 + 814.5]                   cab car leads (rows 0 + 1)
#   [814.5-reverse + 914.5-reverse]   motor car leads (rows 2 + 3)
#
# Sprites: zone-map repaint of the ČD 814.0 sheets (Sim's pak128.CS art),
# written by tools/railrender/gwtr_m152.py (regenerate with
# `python tools/railrender/gwtr.py 814_5`).

