agency: DieLanderbahnCZ
type: "654"
copyright: vojtechzicha      # original art, rendered from a box model

# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "Die Länderbahn CZ"
  agency_cs: "Die Länderbahn CZ"
  family_en: "Siemens-Duewag RegioSprinter"
  family_cs: "Siemens-Duewag RegioSprinter"

# Siemens-Duewag RegioSprinter (maker's type VT 4 N / "RVT"), still registered
# as German class 654 (e.g. 95 80 0654 044-6 D-DLB). Die Länderbahn CZ runs 9
# ex-Vogtlandbahn units of series 2 (1996) and 3 (1997): 654 033 "Slunce",
# 034 "Merkur", 037 "Venuše", 039 "Mars", 040 "Jupiter", 041 "Saturn",
# 042 "Uran", 043 "Neptun", 044 "Pluto". In CZ since 15 Dec 2019 on the
# Ústecký kraj lines U12 Osek město – Most – Louny – Rakovník, U14 Jirkov –
# Chomutov – Žatec – Lužná u Rakovníka, the tourist line T7 Chomutov –
# Vejprty – Cranzahl and PID S58 Rakovník – Kralovice (weekends). Contract to
# Dec 2029, BEMUs from 2031. Modernised by ČMŽO from 2020 (AC, info system).
# (This family used to be a mislabelled 3-part "Pesa LINK II" placeholder
# seeded from a tram sprite, ids 654-front / 054 / 654-rear; the coordinator
# mapped those savegame names to a single vehicle "654"; since 2026-10-14
# the unit is three vehicles again, 654-A + 654-M + 654-B.)
# Unit: three articulated sections A + 2 + A: a cab car on a powered single
# axle at each end, both resting on the short middle module and its two
# axles. End car body 9.64 m, middle 4.10 m, 23.98 m over the bodies, 25.17 m
# over the Scharfenberg couplers, 2.97 m wide, 3.35 m high, floor 530 mm
# (60 % low floor) / 1130 mm over the engines. 2 × MAN D2865 LUH07 at 228 kW,
# hydromechanical (ZF Ecomat), 120 km/h (100–110 in CZ), 31.9 t,
# 70 seats in the DLB CZ layout (zdopravy.cz; 77 as built), 2 × 1.30 m doors
# per side. Up to three units run in multiple.
# Sources: baureihe654.de (Technische Daten, [CZ] Länderbahn), laenderbahn.com/cs,
# cs.wikipedia RegioSprinter, zdopravy.cz.
#
# Livery `vogtlandbahn` (all 9 units, "v barvách DÚK"): the Vogtlandbahn scheme
# with DÚK and Die Länderbahn logos — leaf-green body, ultramarine roof and
# band above the windows that sweeps down both front corners to the skirt, a
# golden-yellow waist stripe from the corner band back to the door and across
# the front at lamp height, dark blue door leaves, green cab roof front,
# green snowplough, Scharfenberg coupler in a dark bag, DÚK arrows mark on
# the cab side (the dark blue "Die Länderbahn" wordmark under the first window
# is left out: at 1x it only makes that window look taller).
# Photos: dlbcz_rs_4 (VT 44 broadside), dlbcz_rs_3 (VT 34 cab close-up),
# dlbcz_rs_9 (VT 39 logos), dlbcz_rs_1 (VT 42 roof), dlbcz_rs_8 (VT 43).
#
# Sprites are rendered from the shared RegioSprinter box model
# (tools/railrender/regiosprinter.py, the GWTR 818 geometry, ex-Vogtlandbahn
# front) with this livery added by tools/railrender/ops_regiosprinter.py;
# regenerate with `python tools/railrender/ops_regiosprinter.py 654`.
# Roof: no AC housings (the DLB roofs are smooth, photos dlbcz_rs_1 / _4 / _8),
# exhaust and horn fin behind the cab. Lamps (head / tail) behind the
# windscreen's bottom corners, red-amber lamp units in the yellow band.
# Three Simutrans vehicles, one per module, so the unit bends at both joints
# in curves: cab module A (length 5, 9.64 m + buffer), middle module M
# (length 2, 4.10 m) and cab module B (length 5), 12 in all (24.8 m, like one
# RS1). Sheet rows 0 / 1 / 2 = A / M / B; check joints with
# `python tools/consist_preview.py <sheet> 5,2,5 out.png`. Power, payload,
# weight and cost of the old single vehicle are split 2 : 1 : 2 (the engines
# sit in the cab modules). Units couple in multiple (up to three in reality):
# A takes the B of a unit ahead, B the A of a unit behind.

