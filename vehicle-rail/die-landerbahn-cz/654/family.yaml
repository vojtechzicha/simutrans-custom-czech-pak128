# Pesa LINK II (DB BR 654, factory designation Pesa 622M) — 3-section articulated
# diesel multiple unit. Two outer motor cars share a middle non-powered trailer
# via Jacobs bogies. Die Länderbahn CZ operates these on the U28 Děčín–Rumburk
# and Trilex routes in DÚK livery.
#
# Sprites: 1024×256, row 0 = motor (used by both end pieces via reverse: true),
# row 1 = middle trailer. Per-section lengths borrowed from the Škoda 15T tram
# template (8/7/8). The DÚK placeholder is seeded from the 15T sprite sheet —
# overlay matching 840/841 RegioShuttle parts on top, then recolor to DÚK.
#
# Constraint structure mirrors ČD 814.2 trio: front motor heads, middle in
# between, rear motor tails (reverse: true shifts its direction columns +4 mod 8
# so its cab points the opposite way using the same sprite row). The only
# buildable consist is front + middle + rear.

