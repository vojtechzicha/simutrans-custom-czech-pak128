agency: KolejeDolnoslaskie
type: "31WE"
copyright: vojtechzicha      # original art, drawn from scratch
# no image_offset: the rail default [0, 4] matches the renderer's anchors

# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "Koleje Dolnośląskie"
  agency_cs: "Koleje Dolnośląskie"
  family_en: "Newag Impuls"
  family_cs: "Newag Impuls"

# Newag Impuls 31WE of Koleje Dolnośląskie (KD): 10 four-section EMUs,
# 31WE-001...005 (2013) and 020...024; some are Czech-equipped and stand in for
# the 45WE on D3/D9 to Lichkov (31WE-021 photographed at Lichkov, 94 51 2 140 655
# worked OsP 6285 / Os 6284 in 2026). Bo'2'2'2'Bo', 3 kV DC, 4 x 500 kW,
# 160 km/h, 74.4 m, 2,895 mm wide, 135 t, 202-204 seats. Doors 1-2-2-1 per
# side (vagonweb side drawing 31WE-v2-a). Pantographs on B and C next to the
# joints with the cab sections, lowered on B, raised on C.
#
# Livery: the KD white / yellow wave scheme of the 45WE (see 45we/family.yaml):
# "KD" + red swoosh behind the cab on the right-hand side, crest + "DOLNY
# ŚLĄSK" on the left-hand side (photos 31WE-022A Jelenia Góra 2025, 31WE
# Wrocław Aug 2025, 31WE-023 Wrocław 2020, 31WE-022D Lichkov, 31WE-021 Lichkov).
#
# Sprites: tools/railrender/impuls.py (python tools/railrender/impuls.py 31we),
# the 45WE model with four sections: lengths 10, 8, 8, 10 carunits (21.5 m end
# sections, 16 m middle sections; 36 cu = 73.1 m for 74.4 m), sections start at
# 0, 10, 18, 26 cu. Headlights on A, tail lights on D. Units couple in multiple.

