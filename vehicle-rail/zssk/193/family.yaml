agency: ZSSK
type: "193"
copyright: vojtechzicha      # original art, rendered from a box model
# Locomotive: no passengers, so the cab glass is plain and never lights up.
windows_lit_when_loaded: false

display:
  agency_en: "ZSSK"
  agency_cs: "ZSSK"
  family_en: "Siemens Vectron MS"
  family_cs: "Siemens Vectron MS"

# Siemens Vectron MS that RS Lease (Rolling Stock Lease, Bratislava) hires to
# ZSSK: 6193 025 and 032 handed over in Dec 2024, then 7193 131-135 and
# 141-145 (2025-26). On Czech track they haul the ZSSK expresses Púchov /
# Žilina - Praha and Humenné - Praha (vagonWEB 16 Feb 2026, owner "RAILL").
# 18.98 m over buffers, Bo'Bo', 6.4 MW, 200 km/h, 90 t; drawn at length 10 like
# the other 19 m locomotives (Leo Express / PKP IC Vectron, pak128.cs 1216).
#
# Livery "Držíme Slovensko v pohybe" (railpage.net photos of 6193 032 / 025,
# Bratislava Dec 2024): bright ZSSK red, black windscreen surround wrapping a
# little round the cab corner, black cab roof caps, anthracite machine-room
# roof, red front with the black "whiskers" panel between the headlights,
# anthracite underframe and lower front. The side carries a fan of thin white
# wave lines rising from behind the cab-1 door to the white ZSSK ring logo; the
# slogan lettering is ~1 px at this scale and is left out (variant B, chosen
# by the user on the comparison page).
#
# Sprites are rendered from a box model: tools/railrender/zssk_vectron.py wraps
# the Leo Express Vectron (tools/railrender/vectron.py) in the 2026-09-26 style.
# Regenerate with `python tools/railrender/zssk_vectron.py`.
# Replaces the CZR objects CZR_RailLeasing_193 and CZR_RailLeasing_193_ZSSK.

vehicles:
  - id: "193"
    role_en: "electric locomotive"
    role_cs: "elektrická lokomotiva"
    row: 0
    prev: any
