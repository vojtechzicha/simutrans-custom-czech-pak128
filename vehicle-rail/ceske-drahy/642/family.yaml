  family_en: "Siemens Desiro Classic"
  family_cs: "Siemens Desiro Classic"

# ČD's own six Desiro Classic units (642.401–406 + 642.901–906, built ~2005),
# bought from Hessische Landesbahn in 2023, repainted into the Doprava Ústeckého
# kraje scheme from Dec 2023 and in service from May 2024 at Děčín (U8 Děčín –
# Rumburk, Šluknovsko). 41.7 m, 126 seats, 2 × 275 kW, 120 km/h, 2 sections on
# 3 bogies (Jakobs). (DB Regio's own leased 642s in DB red are not ČD's.)
#
# Two-section articulated DMU. Sprites: pak128.CS db_desiro (db_642_a + db_642_b,
# Lubak91/Sim), repainted. Both halves are required: 642a always leads, 642b always
# trails. Minimum consist is a-b; longer runs alternate a-b-a-b. (Simutrans has no
# bidirectional flag here, so symmetric head/tail would allow a single half to run
# alone — which is wrong for an articulated DMU.)

