# Class 843 diesel-electric railcar (MSV Studénka / ČKD 1995-97, 31 built) and its
# own trailers: 043 (Btn 753) intermediate car and 943 (Bftn 791) control car.
# Sets in 2026: 843 solo, 843 + 043 + 943 (Olomouc - Krnov - Ostrava, only place
# the 943 runs), 843 + 043 + 843 (Brno). The 943 is drawn with its cab at the
# rear, so it ends a set. Mixed liveries in one set are normal.
# Sources: pak128cs rail-psg mail/842_843/843_balkan.png, 043_balkan.png,
# 943_balkan.png (bodies; Najbrt 1 as reference for the zone map).

vehicles:
