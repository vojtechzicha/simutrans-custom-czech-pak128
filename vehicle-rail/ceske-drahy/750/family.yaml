# ČD class 750 (ČKD T 478.1, rebuilt with electric train heating), "Brejlovec".
# Unmodernised 750s have left ČD passenger service (the 750.7 rebuilds are family
# 750_7); kept because savegames still run it.
#
# Every livery here is a pak128.cs / CZR object ported 1:1 (art extracted from the
# compiled pak, shifted to source coordinates; upstream credit and figures kept per
# livery), so savegames that ran them keep working after the upstream paks went.

