# ČD class 750 (ČKD T 478.1, rebuilt with electric train heating), "Brejlovec".
# Unmodernised 750s have left ČD passenger service (the 750.7 rebuilds are family
# 750_7); kept because savegames still run it.
#
# Sprites: zelenosediva is TommPa9's pak128.cs CD_750_Brejlovec itself (lifted 4 px to
# source coordinates); najbrt1_2 repaints his Brejlovec body with
# tools/railpaint/cd_brejlovec.py. Regenerate with
# `python tools/railpaint/cd_brejlovec.py 750`.

agency: CeskeDrahy
type: "750"
copyright: TommPa9      # his pak128.cs Brejlovec, repainted
windows_lit_when_loaded: false

display:
  agency_en: "ČD"
  agency_cs: "ČD"
  family_en: '"Brejlovec"'
  family_cs: '"Brejlovec"'

vehicles:
  - id: "750"
    role_en: "diesel locomotive"
    role_cs: "motorová lokomotiva"
    row: 0
    prev: any
    next: any
    fields:
      cost: 2815200
      payload: 0
      runningcost: 297
      fixed_cost: 1901
      speed: 100
      weight: 74
      power: 1325
      gear: 130
      length: 8
      intro_year: 1993
      intro_month: 1
      retire_year: 2034
      retire_month: 1
      waytype: track
      engine_type: diesel
      smoke: Diesel
    extended:
      axles: 4

liveries:
  - color: zelenosediva
    name_en: "green-grey"
    name_cs: "zeleno-šedá"
  - color: najbrt1_2
    name_en: "Najbrt 1.2"
    name_cs: "Najbrt 1.2"
