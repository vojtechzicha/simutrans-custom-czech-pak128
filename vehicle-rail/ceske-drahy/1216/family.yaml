# ČD class 1216 (Siemens Taurus ES64U4). ČD's six were withdrawn in summer 2026 and
# offered for sale; kept because savegames still run them. The CZR loco runs free;
# the railjet pair keeps its native coupling: 1216-front must lead, 1216-rear must
# trail (the same sheet, row 1 is the reversed-cab drawing).
#
# Every livery here is a pak128.cs / CZR object ported 1:1 (art extracted from the
# compiled pak, shifted to source coordinates; upstream credit and figures kept per
# livery), so savegames that ran them keep working after the upstream paks went.

