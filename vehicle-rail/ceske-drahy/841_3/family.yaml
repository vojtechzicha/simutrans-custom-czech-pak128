# ČD class 841.3: second-hand 1997–98 RS1 railcars from BSB / SWEG / OSB with
# factory automatic couplers, modernised at DPOV Přerov / Veselí. The PID ones
# (841.303–311, 313–317) run from Tábor and Nymburk since 2025–26 under the
# Středočeský kraj "Motorová revoluce" contract. The Liberecký kraj 841.3s only
# enter service in December 2026 and are not included yet.
# 2 × 257 kW, 120 km/h, about 43 t tare, same 25.5 m shell as the 840.
#
# Body: pak128.CS CD_840 (Lubak91), same PID sheet as the 841.2.

