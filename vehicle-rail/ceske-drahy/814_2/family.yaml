# Sprites: every livery on the same Sim pak128.CS drawings (rail-psg mail/814:
# cd814p = 814 with its cab ahead, cd014s = 014), painted zone by zone with the
# scratch work/p2 painter (fam_814.py). The trio only ever wore these three
# schemes (research/dmu/814/liveries_814.md).
liveries:
  # original Konting yellow-green (~13-14 sets left in 2026)
  - color: zlutozelena
    name_en: "yellow-green"
    name_cs: "žluto-zelená"
    source: the upstream Sim yellow-green pixels (glass made night-lit, cab windscreens dark)
  # 9 sets in the corporate scheme
  - color: najbrt2
    name_en: "Najbrt 2"
    name_cs: "Najbrt 2"
    source: painted on the Sim bodies (sapphire roof, white roof-edge strip, sky window band, sapphire stripe, bottom band and doors; white windscreen surround, sky mask)
  # PID pyjama on at least 3 sets for the Posázavský pacifik (814.247/248 + 014.024 …)
  - color: pidsedocervena
    name_en: "PID grey-red"
    name_cs: "PID šedo-červená"
    source: painted on the Sim bodies from photos of 814 248 (2024), 814 246 (2025) and 814 233 (2026)
