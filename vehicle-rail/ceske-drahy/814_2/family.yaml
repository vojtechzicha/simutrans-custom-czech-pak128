# Three-car set: 814.2 motor car + 014 partly low-floor middle car + 814.2 motor
# car, Pars nova 2007-10 (26 sets). Unit 42.41 m, 135 seats + 151 standing,
# 62.3 t, 2 x 242 kW, 80 km/h. Took over Praha - Kladno - Rakovník from the 854
# in May 2026. The only buildable consist is front + middle + rear; the rear
# motor car is the front one turned round (row 2: direction columns shifted by
# 4, moved one carunit forward, lamps swapped), so its tail lamps face backwards.

