# 7-car tilting EMU, unit class 680 (Alstom, 7 units built 2003-05, 6 in service
# in 2026): 681 + 081 + 683 + 084 + 684 + 082 + 682, where 681 / 682 are the cab
# cars and 681 / 683 / 684 / 682 the powered ones (4 x 980 kW = 3920 kW).
# Approved for 200 km/h (design 230); regular service from Dec 2005.
# Art: pak128cs rail-psg mail/680/cd_680_pendolino.png (TommPa9) repainted to the
# real Kotas livery zone by zone, keeping the upstream shading. End cars 27.65 m (length 13),
# middle cars 25.9 m (length 12).

