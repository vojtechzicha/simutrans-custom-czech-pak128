# Single Stadler Regio-Shuttle RS1 railcar, ČD class 840: 16 built by Stadler
# Pankow in 2011–12 for Liberecký kraj (the steep-gradient version for Tanvald –
# Harrachov), 15 left after the 840.011 fire in 2021. Najbrt 1 since delivery;
# from June 2026 they are being repainted into the Liberecký kraj / IDOL
# red-white scheme (840.005 first). 25.5 m, 2 × 265 kW, 120 km/h, 43 t tare.
#
# Body: pak128.CS CD_840 (Lubak91) from vehicle.motorak.840_841.pak, extracted
# with tools/pak_extract.py and repainted zone by zone by tools/railpaint/cd_rs1.py (every view, lit glass,
# plain amber destination displays). The old sheet had the n/s, ne/sw and
# nw/se views swapped; this one matches the upstream placement.

vehicles:
  - id: "840"
    role_en: "railcar"
    role_cs: "motorový vůz"
    row: 0
    fields:
      cost: 3191200
      payload: 113
      speed: 120
      weight: 43
      runningcost: 71
      fixed_cost: 1148
      intro_year: 2011
      intro_month: 6
      retire_year: 2040
