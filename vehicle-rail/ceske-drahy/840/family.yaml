liveries:
  - color: najbrt1
    name_en: "Najbrt 1"
    name_cs: "Najbrt 1"
    source: CD_840 body repainted in ČD Najbrt 1 (light grey roof, azure band and pillars, sapphire stripe, light grey lower body, darker blue doors; blue front mask, sapphire band under the lamps, yellow skirt edge)
  - color: libereckykraj
    name_en: "Liberecký kraj"
    name_cs: "Liberecký kraj"
    source: CD_840 body repainted in the Liberecký kraj / IDOL base layout (white body and roof, red doors, red bottom band sweeping up into red cab fronts, thin red windscreen frame, red IDOL rings behind the cabs); the eight per-car wrap variants are not modelled
