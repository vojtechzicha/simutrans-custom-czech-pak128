agency: CeskeDrahy
type: "811"
copyright: Sim

# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "ČD"
  agency_cs: "ČD"
  family_en: "RegioMouse"
  family_cs: "RegioMouse"

# Class 811 (2020): 14 class 810s rebuilt by DPOV in 2020-21 for the Moravskoslezský
# kraj (air-conditioning, Tedom 242 kW engine limited to 152 kW for traction,
# 45 seats), marketed by ČD as "RegioMouse". Body and cab are the 810's; the
# visible change is the flat A/C unit centred on the roof. Still in service in 2026
# around Suchdol nad Odrou. (Not the 1997 prototype 811, nor the Slovak 811
# "mandarinka" with its new cab.) Standing capacity is unpublished; 40 as on the 810.

vehicles:
  - id: "811"
    role_en: "railcar"
    role_cs: "motorový vůz"
    row: 0
    head: true
    tail: true
    prev: ["012"]
    next: ["012"]
    fields:
      cost: 1092600
      payload: 85
      speed: 80
      weight: 21
      runningcost: 16
      fixed_cost: 82
      intro_year: 2020
      intro_month: 8
      retire_year: 2030
      retire_month: 1
      waytype: track
      freight: Passagiere
      length: 7
      engine_type: diesel
      power: 152
      smoke: Diesel_black
      gear: 108
    extended:
      axles: 2

  # BDtax 782 (ex 012): the 810-family trailer with a bike/luggage bay, same body
  # as the 010. The ones rebuilt with the 811s for the Moravskoslezský kraj wear
  # the same Najbrt 2 + MSK scheme and run coupled to them (e.g. 29 064, 2025).
  # 13.97 m, 52 seats, 15 t, 80 km/h.
  - id: "012"
    role_en: "trailer"
    role_cs: "přípojný vůz"
    row: 1
    head: false
    tail: true
    prev: ["811", "012"]
    next: ["811", "012"]
    fields:
      cost: 820000
      payload: 92
      speed: 80
      weight: 15
      runningcost: 6
      fixed_cost: 31
      intro_year: 2020
      intro_month: 8
      retire_year: 2030
      retire_month: 1
      waytype: track
      freight: Passagiere
      length: 7
    extended:
      axles: 2

# Sprites: the Sim pak128.CS 810 body repainted from photos (811 476, 811 444,
# 811 173), plus the roof A/C unit; row 1 the Sim Btax (010) body in the same
# scheme for the 012.
liveries:
  - color: najbrt2
    name_en: "Najbrt 2, Moravskoslezský kraj"
    name_cs: "Najbrt 2, Moravskoslezský kraj"
    # the only scheme the class wore: Najbrt 2 (sapphire roof, visor, A/C unit and
    # underframe, sky-blue window band, sapphire doors) with Moravskoslezský kraj logos
