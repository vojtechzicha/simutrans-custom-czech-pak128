# Class 811 (2020): 14 class 810s rebuilt by DPOV in 2020-21 for the Moravskoslezský
# kraj (air-conditioning, Tedom 242 kW engine limited to 152 kW for traction,
# 45 seats), marketed by ČD as "RegioMouse". Body and cab are the 810's; the
# visible change is the flat A/C unit centred on the roof. Still in service in 2026
# around Suchdol nad Odrou. (Not the 1997 prototype 811, nor the Slovak 811
# "mandarinka" with its new cab.) Standing capacity is unpublished; 40 as on the 810.

