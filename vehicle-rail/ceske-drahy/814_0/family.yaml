agency: CeskeDrahy
type: "814.0"
copyright: Sim

# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "ČD"
  agency_cs: "ČD"
  family_en: "RegioNova"
  family_cs: "RegioNova"

# Two-car push-pull DMU: 814.0 motor car + 914 partly low-floor cab trailer,
# rebuilt by Pars nova 2005-12 from 810/010 (210 sets for ČD, ~190-205 still in
# service 2026; the most numerous ČD DMU). Unit 28.44 m, 84 seats + 105 standing,
# 39.6 t in service, 242 kW, 80 km/h.
#
# Each car has its cab at the outer end, so a sprite is only right in one convoy
# position. Both orientations are modelled, each car drawn for its position:
#
#   [914 + 814.0]                   cab car leads (rows 0 + 1)
#   [814.0-reverse + 914-reverse]   motor car leads (rows 2 + 3)
#
# Rows 1 and 3 are rows 2 and 0 turned round (the Sim drawings of a rear car
# are the front car with the direction columns shifted by 4, moved one carunit
# forward and with the lamps swapped, so the lit headlights stay at the leading
# end). Constraints reject single cars and cross-mixed orientations. Liveries
# couple freely: mixed sets are normal (e.g. a Kraj Vysočina 814 with a
# Pardubický kraj 914, the only way the Vysočina scheme ever ran).

vehicles:
  - id: "914"
    role_en: "front cab car"
    role_cs: "přední řídicí vůz"
    row: 0
    head: true
    tail: false
    prev: []
    next: ["814.0"]
    couple_liveries: true
    fields:
      cost: 979000
      payload: 89                   # 36 seats + standing in the low-floor centre
      speed: 80
      weight: 18
      runningcost: 3
      fixed_cost: 15
      intro_year: 2005
      intro_month: 11
      retire_year: 2035
      retire_month: 5
      waytype: track
      freight: Passagiere
      length: 7
    extended:
      axles: 2

