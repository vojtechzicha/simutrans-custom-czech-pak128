# Two-car push-pull DMU with cab cars at the outer ends. The source PNG draws
# each car with its cab on one specific physical side, so each sprite is only
# correct in ONE convoy position. We model both orientations:
#
#   [914-front + 814.0-rear]                — cab car leads (natural sprites)
#   [814.0-front + 914-rear]                — motor car leads (reverse: true,
#                                              column index shifted +4 mod 8)
#
# Constraints reject single-car consists and cross-mixed orientations: each
# normal car can only pair with the other normal car, and each reverse car
# can only pair with the other reverse car.

