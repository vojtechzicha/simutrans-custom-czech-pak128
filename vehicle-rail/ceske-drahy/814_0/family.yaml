# Sprites: every livery on the same Sim pak128.CS drawings (rail-psg mail/814:
# cd914p_zhasnuty = 914, cd814p = 814 with its cab ahead, the yellow-green and
# Železnice Desná sheets as references), painted zone by zone by
# tools/railpaint/cd_814.py (regenerate with `python tools/railpaint/cd_814.py`).
liveries:
  # original Konting design (2005): dark-yellow ends, light-yellow middle, green
  # field (∩ on the 814, U on the 914); still the most common in 2026
  - color: zlutozelena
    name_en: "yellow-green"
    name_cs: "žluto-zelená"
    source: the upstream Sim yellow-green pixels (glass made night-lit, cab windscreens dark)
  # the corporate repaint at overhaul since 2014 (≥65 sets)
  - color: najbrt2
    name_en: "Najbrt 2"
    name_cs: "Najbrt 2"
    source: painted on the Sim body (sapphire roof, white roof-edge strip, sky window band, sapphire stripe, bottom band and doors; white windscreen surround, sky mask)
  # 6 sets for Český les since 2023: royal blue with white cantrail, yellow doors,
  # green/yellow swooshes, anthracite skirt, white front hood
  - color: plzenskykraj
    name_en: "Plzeňský kraj"
    name_cs: "Plzeňský kraj"
    source: painted on the Sim body from photos of 814/914 039 and 015 (2023-24)
  # 2018-: navy roof and lower band, red roof-edge strip and red frame round the
  # front, white body, yellow doors (11+ motor cars)
  - color: pardubickykraj
    name_en: "Pardubický kraj"
    name_cs: "Pardubický kraj"
    source: painted on the Sim body from photos of 914 041, 914 050 (2019) and 914 048 (2023)
  # the Pardubice layout with light green instead of red and green doors; only
  # 814 041, 814 048 and 914 018, each coupled to a Pardubický kraj partner
  - color: vysocina
    name_en: "Kraj Vysočina"
    name_cs: "Kraj Vysočina"
    source: painted on the Sim body from photos of 814 041 (2019) and 814 048 (2023)
  # Prague integrated transport "pyjama" since 2024: grey with red blocks, black
  # window band and doors, red band on the front (4 sets)
  - color: pidsedocervena
    name_en: "PID grey-red"
    name_cs: "PID šedo-červená"
    source: painted on the Sim body from photos of 814 124 (2025) and the PID trios
