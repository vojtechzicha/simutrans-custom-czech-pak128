  agency_en: "ČD"
  agency_cs: "ČD"
  family_en: '"Brejlovec"'
  family_cs: '"Brejlovec"'

vehicles:
  - id: "750.7"
    role_en: "diesel locomotive"
    role_cs: "motorová lokomotiva"
    row: 0
    prev: any
    next: any
    fields:
      cost: 3100000
      payload: 0
      speed: 100
      weight: 72
      runningcost: 175
      fixed_cost: 1100
      intro_year: 2010
      intro_month: 9
      waytype: track
      engine_type: diesel
      power: 1550
      smoke: Diesel
      gear: 180
      length: 8
    extended:
      axles: 4

liveries:
