agency: CeskeDrahy
type: "847"
copyright: Sim

# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "ČD"
  agency_cs: "ČD"
  family_en: "RegioFox"
  family_cs: "RegioFox"

# PESA LINK II with the new "fox" front, 106 units delivered 2023–26. One
# articulated unit: two mirror-image, both-powered cab sections (750 kW,
# 2 × 375 kW) on a shared Jakobs bogie, 44.47 m, 115 seats + 96 standing, 82 t,
# 120 km/h permitted (140 design).
#
# Sprites: the pak128_czr PESA drawing shared with the 844 (see
# 844/family.yaml); row 0 = front section, row 1 = rear section, `length: 9`
# closes the Jakobs joint. The front section shows lit headlights, the rear
# section lit tail lamps.

vehicles:
  - id: "847"
    role_en: "front section"
    role_cs: "přední článek"
    row: 0
    head: true
    tail: false
    prev: []
    next: ["847b"]
    fields:
      cost: 1674750
      payload: 105
      speed: 120
      weight: 41
      runningcost: 30
      fixed_cost: 170
      intro_year: 2023
      intro_month: 8
      retire_year: 2055
      retire_month: 1
      waytype: track
      freight: Passagiere
      length: 9
      engine_type: diesel
      power: 375
      smoke: Diesel
      gear: 135
    extended:
      axles: 4

  - id: "847b"
    display_id: "847"
    role_en: "rear section"
    role_cs: "zadní článek"
    row: 1
    head: false
    tail: true
    prev: ["847"]
    next: []
    fields:
      cost: 1674750
      payload: 105
      speed: 120
      weight: 41
      runningcost: 30
      fixed_cost: 170
      intro_year: 2023
      intro_month: 8
      retire_year: 2055
