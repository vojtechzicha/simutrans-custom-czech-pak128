# ČD class 794: CZ LOKO two-axle diesel-electric shunter for light shunting and
# line work. Prototype 794.001 (2015, Třinecké železárny, then ČD Brno); ČD
# ordered 12 in 2017, delivered 794.002-013 from 9/2017 to 2/2019. 7.94 m over
# buffers, Bo, Caterpillar C13 328 kW with AC/DC transmission, 60 km/h, 28-32 t.
# Long hood with two red radiator guards on each side next to the cab, raised
# end cab with a sun visor over the front windows.
# Sources: cs.wikipedia "Lokomotiva 794"; atlasvozu.cz 794 (10 units, all
# Najbrt 2); Commons Category:CZ Class 794 of ČD in Najbrt livery
# ("Lokomotiva 794 010 - 9 obr.02-08", used for the proportions and bands).
#
# Livery najbrt2 (all units): sapphire frame, hood roof and cab roof; hood side
# from the bottom sapphire / white / light blue / thin white / sapphire top
# edge, the same bands round the cab with a light-blue window zone.
#
# Sprites: original art, rendered from a box model in the 2026-09-26 render style
# (tools/railrender/style.py: dark roof gutters, no 1-px lettering, receding
# handrails, style.polish),
# tools/railrender/cd_loco_shunter.py; regenerate with
# `python tools/railrender/cd_loco_shunter.py 794`. Length 4 like the other
# two-axle shunters.

