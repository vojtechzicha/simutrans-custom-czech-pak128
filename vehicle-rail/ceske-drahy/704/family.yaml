# ČD class 704: ČKD T 238.0 two-axle diesel-electric shunter. Prototypes 1988
# (T 234.0 / T 237.0), series 1991-94; 7.50 m over buffers, Bo, 250 kW, 60 km/h,
# 29 t. Long hood, cab off-centre towards one end, short hood behind it, cab roof
# overhanging both cab ends. About 12 in ČD depot and station shunting in 2026
# (704.001 is a museum loco and is not shipped).
# Sources: cs.wikipedia "Lokomotiva 704"; atlasvozu.cz 704; Commons photos
# "20250804 České dráhy 704014" (N2) and "Tabor (49509029913)" (red-cream,
# side-on, used for the proportions).
#
# Liveries (research census 2026: red-cream ≈7, Najbrt 2 ×4, Najbrt 1.2 ×2):
#   cervenokremova  ČSD red-cream: red hoods and cab, a cream band round the loco
#                   at mid-hood height, dark grey frame, weathered roof.
#   najbrt2         sapphire frame, cab window zone and cab roof; hoods and lower
#                   cab light blue above a white band at the hood bottom, white
#                   louvre panels, white ČD logo on the long hood by the cab.
#   najbrt1_2       light grey body with a sapphire-over-light-blue trapezoid on
#                   the long hood, dark sill, light grey roof. No photo of a
#                   704 in N1.2 was found; the layout follows the 362 / 754.
#
# Sprites: original art, rendered from a box model in the 2026-09-26 render style
# (tools/railrender/style.py: dark roof gutters, no 1-px lettering, receding
# handrails, style.polish),
# tools/railrender/cd_loco_shunter.py; regenerate with
# `python tools/railrender/cd_loco_shunter.py 704`. Length 4 like the native
# CD_704 and the RegioJet 703.

