# ČD class 162 "Peršing": Škoda 71E (ČSD E 499.3 derivative for 140 km/h), 3 kV DC,
# 3 480 kW, 140 km/h, 85 t, Bo'Bo', 16.8 m over buffers. 60 built 1991 (162.001-060)
# and 162.061-080 for ČSD/ČD; about 32 in regular ČD service in 2025-26 (Děčín,
# Praha-Vršovice, Česká Třebová), 20 with WTB for push-pull Os/Sp in north Bohemia
# and around Praha. From 2025 ČMŽO Přerov rebuilds them one by one into dual-system
# 362.2 (362.212/213/216/220 done by end 2025); the rest get ETCS.
# Sources: research loco_census.md (atlasvozu.cz 162, cs.wikipedia Lokomotiva 162),
# Commons "CZ Class 162 of ČD in Najbrt livery" (162 013, 039, 054, 062, 097).
#
# Body: side A (+v) four portholes, side B (-v) the long dark louvre band between the
# doors; two raised louvred resistor blocks mid-roof, cab air-conditioning box over
# cab 1, two single-arm pantographs.
#
# Liveries:
#   najbrt2   (about 31 locos) light blue upper body, white band over the lamps,
#             dark blue sill and buffer beam, grey roof, white ČD logos.
#   najbrt1_2 (162.054) light grey cab ends and fronts with a light blue window band,
#             a dark blue wedge behind each cab and light blue between, dark grey
#             sill, light grey roof.
#
# Sprites: original art, rendered from a box model (tools/railrender/cd_loco_e99.py
# on the rj_locos.E99 16.8 m Škoda 99E body, fitted to the native CD 363); regenerate
# with `python tools/railrender/cd_loco_e99.py 162`. Length 8 like the native CD 363.

