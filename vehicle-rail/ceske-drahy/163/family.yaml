# ČD class 163 "Peršing": Škoda 71E (E 499.3), 3 kV DC, 3 480 kW, 120 km/h, 85 t,
# Bo'Bo', 16.8 m over buffers. Built 1984-1992 for ČSD. At ČD passenger unrostered
# since Dec 2024 (replaced by RegioPanters) and kept as reserves: about 13 left at
# Bohumín, Česká Třebová and Děčín. (ČD Cargo's 163s are a separate company, out of
# scope; ČD has no 363 left, all became 362.)
# Sources: research loco_census.md (dopravacek.eu 10 Aug 2024, atlasvozu.cz 163),
# Commons "CZ Class 163 of ČD" / "... in Najbrt livery" (163 004, 043, 062, 068, 080).
#
# Body as 162 (portholes on side A, louvre band on side B, raised resistor blocks),
# without the cab air-conditioning box.
#
# Liveries:
#   najbrt2      (most) light blue upper body, white band over the lamps, dark blue
#                sill and buffer beam, grey roof, white ČD logos.
#   zelenozluta  ČD green with the yellow band over the lamps on the sides and fronts,
#                yellow windscreen frames, black ČD logo (163 004, 068, 062).
#
# Sprites: original art, rendered from a box model (tools/railrender/cd_loco_e99.py
# on the rj_locos.E99 16.8 m Škoda 99E body, fitted to the native CD 363); regenerate
# with `python tools/railrender/cd_loco_e99.py 163`. Length 8 like the native CD 363.
#
# The *_klasik liveries are the pak128.cs / CZR objects ported 1:1 (art extracted from
# the compiled pak, shifted to source coordinates; each livery keeps the upstream
# credit and figures as its own `fields:` override), so savegames that ran them
# keep working after the upstream paks were uninstalled.

