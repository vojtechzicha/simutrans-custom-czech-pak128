copyright: Sim

# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "ČD"
  agency_cs: "ČD"
  family_en: '"Šukafon"'
  family_cs: '"Šukafon"'

# Single railcar: 28 class 810s converted 1994-96 for driver-only operation
# (ticket sales by the driver). Interior changes only, so body and livery zones
# are the 810's. Source: pak128cs rail-psg mail/810/809.dat (CD_809).

vehicles:
  - id: "809"
    role_en: "railcar"
    role_cs: "motorový vůz"
    row: 0
    fields:
      cost: 1057800
      payload: 95
      speed: 80
      weight: 20
      runningcost: 20
      fixed_cost: 102
      intro_year: 1996
      intro_month: 4
      retire_year: 2026             # by 2025/26 all were reserves at Louny
      retire_month: 1
      waytype: track
      freight: Passagiere
      length: 7
      engine_type: diesel
      power: 155
      smoke: Diesel_black
      gear: 105
    extended:
      axles: 2

# Sprites: the Sim pak128.CS 810 body repainted from photos (same art as the 810
# railcar in each livery).
liveries:
  - color: najbrt1
    name_en: "Najbrt 1"
    name_cs: "Najbrt 1"
    # umbra-grey roof, sky-blue window band, sapphire sill stripe and doors,
    # light-grey lower body (e.g. 809 057, 809 657)
  - color: najbrt2
    name_en: "Najbrt 2"
    name_cs: "Najbrt 2"
    # sapphire roof, visor and underframe, light stripe under the roof edge,
    # sky-blue window band, sapphire doors (e.g. 809 179, 809 345)
  - color: cervenokremova
    name_en: "red-cream"
    name_cs: "červeno-krémová"
    # ČD 1998 scheme: red body incl. window band and doors, cream band below the
    # windows and across the fronts (e.g. 809 080, 809 179 in 2009)
