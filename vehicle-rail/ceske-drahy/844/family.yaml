agency: CeskeDrahy
type: "844"
copyright: Sim

# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "ČD"
  agency_cs: "ČD"
  family_en: "RegioShark"
  family_cs: "RegioShark"

# PESA LINK II (223M), 31 built 2011–13 (30 in service; 844.006 written off
# after the 2021 Milavče collision). One articulated unit: two mirror-image,
# both-powered cab sections (one MTU 6H1800 engine each, 2 × 390 kW) on a shared
# Jakobs bogie, 43.73 m, 120 seats + 120 standing, 86 t, 120 km/h.
#
# Sprites: the pak128_czr PESA drawing (CZR-CD-847 / 847b, shifted up 4 px for
# the default image_offset). Row 0 = front section (cab ahead), row 1 = rear
# section (cab behind); the two are drawn at their own tile positions, so the
# rear section keeps its own row instead of `reverse: true`. The drawing's
# sections are ~9.4 carunits long, so `length: 9` closes the Jakobs joint in all
# 8 views (tools/consist_preview.py). The 844 and 847 share the drawing; the
# liveries paint their different fronts (847: black grille band).
#
# The front section's cab lamps are lit headlights, the rear section's are
# lit tail lamps.

vehicles:
  - id: "844"
    role_en: "front section"
    role_cs: "přední článek"
    row: 0
    head: true
    tail: false
    prev: []
    next: ["844b"]
