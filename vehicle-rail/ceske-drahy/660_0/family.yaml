  agency_en: "ČD"
  agency_cs: "ČD"
  family_en: "InterPanter"
  family_cs: "InterPanter"

# Škoda 10Ev InterPanter, 3-car 660.0 + 662.0 + 661.0: 4 units at Brno since
# June 2015 (R13 Brno - Břeclav - Olomouc, R Brno - Česká Třebová - Praha, Sp to
# Hodonín / Staré Město u UH), 3 kV DC + 25 kV AC, 160 km/h. Every car has one
# powered bogie (2 x 340 kW, 2040 kW per unit); 200 seats, 25 of them 1st class
# in the 662 and 661 (the 660 is 2nd class only). One door per car side.
# Units couple in multiple: a 661 takes the 660 of the next unit, in any livery.
#
# Sprites: the native pak128.CS InterPanter by TommPa9 (CD_660 / 662 / 661),
# repainted in Najbrt 2 (the only livery all 14 InterPanters have worn) with
# the shared ČD palette: sky-blue body, sapphire waist line, doors, valance and
# roof equipment, light-grey stripe, cant rail and cab hood, yellow 1st-class
# stripe and anti-climber (scratchpad work/p2/fam_660.py).

