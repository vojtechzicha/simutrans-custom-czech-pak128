agency: CeskeDrahy
type: "471"
copyright: TommPa9

# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "ČD"
  agency_cs: "ČD"
  family_en: "CityElefant"
  family_cs: "CityElefant"

# Škoda 1Ev double-deck EMU: 471 motor car (pantograph, cab) + 071 trailer +
# 971 cab trailer, 26.4 m each (13 carunits), 310 seats + 333 standing,
# 2000 kW, 140 km/h, 3 kV DC. 82 units in service in 2026 (Praha / Středočeský
# kraj, Bohumín); the EMU 400 order replaces them from about 2030.
#
# Sprites: the pak128.CS 471 drawing by TommPa9 (CD_471_Esus_I/II/III, one
# silhouette in three liveries) repainted with a zone map per livery: rows
# (upper deck, between the decks / end-section windows, lower deck, skirt) and
# car segments (end sections, doors, double-deck middle); thin grey pantograph.
# Liveries in service in 2026 (research: atlasvozu.cz per-car lists, photos):
# the 2006 CityElefant white / light blue / red scheme with the cab swoosh, PID
# grey-red (painted 471 060, film wraps since 2023), Najbrt 1 (028–030,
# 061–075) and Najbrt 2 (076–083). The original "ledovec" scheme ended in 2024.
#
# Units run in pairs on the busy PID lines: a 971 couples to the 471 of the next
# unit in any livery, while the cars inside one unit match.

vehicles:
  - id: "471"
    role_en: "motor car"
    role_cs: "motorový vůz"
    row: 0
    head: true
    tail: false
    prev: ["971"]
    next: ["071"]
    couple_liveries: prev     # the rear car of a unit ahead may wear any livery
    fields:
      cost: 18384000
      payload: 129
      speed: 140
      weight: 60
      runningcost: 60
      fixed_cost: 538
      intro_year: 2000
      intro_month: 1
      retire_year: 2032
      retire_month: 1
      waytype: track
      freight: Passagiere
      length: 13
      engine_type: Electric
      power: 2000
      gear: 180
    extended:
      axles: 4

  - id: "071"
    role_en: "middle trailer"
    role_cs: "vložený vůz"
    row: 1
    head: false
    tail: false
    prev: ["471"]
    next: ["971"]
    fields:
      cost: 18384000
      payload: 269
      speed: 140
      weight: 47
      runningcost: 22
      fixed_cost: 197
      intro_year: 2000
      intro_month: 1
      retire_year: 2032
      retire_month: 1
