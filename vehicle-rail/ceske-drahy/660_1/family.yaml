agency: CeskeDrahy
type: "660.1"
copyright: TommPa9

# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "ČD"
  agency_cs: "ČD"
  family_en: "InterPanter"
  family_cs: "InterPanter"

# Škoda 10Ev InterPanter, 5-car 660.1 + 662.1 + 064.1 + 662.2 + 661.1: 10 units
# at Brno since June 2015 (same work as the 660.0), 3 kV DC + 25 kV AC,
# 160 km/h. The 064.1 middle car has no traction; the other four cars have one
# powered bogie each (2 x 340 kW, 2720 kW per unit); 350 seats, 42 of them
# 1st class in the 662s and the 661 (the 660 is 2nd class only). One door per
# car side. Units couple in multiple: a 661.1 takes the 660.1 of the next unit,
# in any livery.
#
# Sprites: the native pak128.CS InterPanter by TommPa9 (CD_660 / 662 / 064 /
# 661), repainted in Najbrt 2 like the 660.0 (tools/railpaint/interpanter.py);
# the two 662s share one drawing, the 064 is the 662 without the 1st-class
# stripe.

