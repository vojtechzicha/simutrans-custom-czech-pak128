# Class 848: 12 second-hand Stadler GTW 2/6 (ex-DB class 646, built 1999–2000),
# bought from DB Regio in 2018 and modernised by ŽOS Zvolen; first in service
# 20 May 2020, all 12 modernised by 2022. They run only in the Olomoucký kraj
# (Olomouc – Senice na Hané / Drahanovice, Olomouc – Hlubočky – Moravský Beroun,
# Šumperk – Hanušovice / Jeseník / Sobotín, Lipová – Javorník).
# 38.7 m, 108 seats + 103 standing, 59 t empty, 550 kW MTU diesel-electric in the
# power module, 120 km/h, axles 2'Bo'2'.
#
# Three sections like the real unit: two passenger end cars resting on the short
# central power module (engine box + the powered bogie). Sprites: original box
# render (vojtechzicha), the Arriva 848 GTW model of tools/railrender/gtw.py in
# Najbrt 2, written by tools/railrender/cd_848.py (the owner's pick over the
# repainted ZSSK 840 drawing, 2026-10-20); section lengths 8 + 3 + 8 as gtw.py
# (the real joints). The only buildable consist is front car + power module +
# rear car.

