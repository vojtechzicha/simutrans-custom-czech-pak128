agency: KolejeSlaskie
type: "21WEa"
copyright: vojtechzicha      # original art, drawn from scratch
# no image_offset: the rail default [0, 4] matches the renderer's anchors

# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "Koleje Śląskie"
  agency_cs: "Koleje Śląskie"
  family_en: "Pesa Elf 2"
  family_cs: "Pesa Elf 2"

# Pesa Elf 2 21WEa(g) of Koleje Śląskie (KŚ): 5 three-section EMUs, first in
# service Sept 2017; the original five units approved for Czech track and
# regular stand-ins on line S71 Katowice - Chałupki - Bohumín (21WEa-001 seen in
# 2026). Bo'2'2'Bo' on Jakobs bogies, 3 kV DC, 1,600 kW, 160 km/h, ~59 m,
# 2,880 mm wide, 4,280 mm high, 154 seats + 114 standing. Doors 1-2-1 per side
# (vagonweb side drawing 21WEa-a); both pantographs on the middle section.
#
# Livery (KŚ): see 22wed/family.yaml. Photos 21WEa-002 Katowice, 21WEa-003
# (research/ops/photos/ks), 21WEa-002B (Commons).
#
# Sprites: tools/railrender/elf2.py (python tools/railrender/elf2.py 21wea).
# Lengths 10, 8, 10 carunits (end sections 22 m, middle section 16.3 m),
# sections start at 0, 10, 18 cu. Sections A-C-B (fronts 21WEa-002B / -003B,
# middle 21WEa-001C); headlights on A, tail lights on B. Units couple in multiple, also with the
# 4-section 22WEd (Commons photo "Coupled 22WEd-010 with 21WEa-003").

