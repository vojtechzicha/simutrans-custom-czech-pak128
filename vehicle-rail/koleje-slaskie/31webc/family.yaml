agency: KolejeSlaskie
type: "31WEbc"
copyright: vojtechzicha      # original art, drawn from scratch
# no image_offset: the rail default [0, 4] matches the renderer's anchors

# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "Koleje Śląskie"
  agency_cs: "Koleje Śląskie"
  family_en: "Newag Impuls 2"
  family_cs: "Newag Impuls 2"

# Newag Impuls 2 31WEbc of Koleje Śląskie (KŚ): four-section EMUs, first three
# in service 24 Feb 2025, more delivered through 2025 (31WEbc-001...012 seen);
# the planned type of line S71 Katowice - Rybnik - Wodzisław Śl. - Chałupki -
# Bohumín (Os 2960-2969, 5 pairs a day, ~3 km on Czech track). Bo'2'2'2'Bo',
# 3 kV DC, 2,000 kW, 160 km/h, 75.6 m, 192 seats + 208 standing. Separate cab
# doors, doors 2-2-2-2 per side (vagonweb side drawing 31WEbc-a).
# Pantographs on B and C next to the joints with the cab sections.
#
# Livery (KŚ): white body, azure nose and cab sides with the white body ending
# in a rounded edge under the cab side window, azure roof and a thin azure
# stripe along the sole bar, black window band, yellow doors framed in azure,
# the KŚ ribbon (yellow / green / blue stripes) behind each cab. Photo
# 31WEbc-001 at Katowice (Os 44139 to Chałupki, research/ops/photos/ks).
#
# Sprites: tools/railrender/impuls.py with the Impuls 2 cab
# (python tools/railrender/impuls.py 31webc). Lengths 10, 8, 8, 10 carunits
# (end sections 21.65 m, middle sections 16.3 m), sections start at 0, 10, 18,
# 26 cu. Headlights on A, tail lights on D. Units couple in multiple.

