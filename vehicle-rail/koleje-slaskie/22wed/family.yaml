agency: KolejeSlaskie
type: "22WEd"
copyright: vojtechzicha      # original art, drawn from scratch
# no image_offset: the rail default [0, 4] matches the renderer's anchors

# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "Koleje Śląskie"
  agency_cs: "Koleje Śląskie"
  family_en: "Pesa Elf 2"
  family_cs: "Pesa Elf 2"

# Pesa Elf 2 22WEd(g) of Koleje Śląskie (KŚ): 12 four-section EMUs delivered
# Feb 2018 - May 2019; approved for Czech track by UTK in Oct 2025 and the
# regular stand-in on line S71 Katowice - Chałupki - Bohumín (22WEdg-007 seen
# in 2026). Bo'2'2'2'Bo' on Jakobs bogies, 3 kV DC, 4 x 500 kW, 160 km/h,
# ~75 m, 2,880 mm wide, 4,280 mm high, 190 seats + 150 standing. Doors
# 2-2-2-2 per side (vagonweb side drawing 22WEd-a).
#
# Livery (KŚ): azure nose with a dark grey face mask, azure roof, white body,
# black window band, thin azure stripe along the sole bar, yellow doors framed
# in azure, KŚ ribbon behind the cabs. Photos 22WEd-002 Gliwice 2025,
# 22WEd-012 Częstochowa 2025, 22WEd-002A / -006 / -010B (Commons).
#
# Sprites: tools/railrender/elf2.py (python tools/railrender/elf2.py 22wed),
# the Impuls unit model of impuls.py with the Elf 2 cab. Lengths 10, 8, 8, 10
# carunits (end sections 22 m, middle sections 16.3 m), sections start at 0,
# 10, 18, 26 cu. Headlights on A, tail lights on B (Pesa letters the sections A-C-D-B, cab
# ends A and B: fronts 22WEd-010B, 22WEd-012B). Units couple in multiple, also
# with the 3-section 21WEa (Commons photo "Coupled 22WEd-010 with 21WEa-003").

