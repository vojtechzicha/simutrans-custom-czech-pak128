# RegioJet ex-ÖBB coaches. Original art drawn from scratch: box models from the
# vagonWEB scale side drawings (10 px = 1 m), rendered by tools/railrender/rjcoach.py
# (regenerate with `python tools/railrender/regiojet.py obb`), 26.4 m = length 13.
# Livery: Patrik Kotas 2011, RAL 1028 melon yellow + anthracite window band + silver
# doors, red/navy "|| REGIOJET" logo. Sources: vagonWEB RJ fleet description (Sep 2026),
# cs.wikipedia (Vůz Ampz/ABmz/Amz/Bmz RJ), rj.macoslav.cz.
# Ex-ÖBB Eurofima / Z1 day coaches (SGP / Jenbacher / Fiat 1976-79), bought 2011-2014,
# upgraded by ÖBB 2001-10. RJ codes: A000 = Ampz 61 81 18-91 (9 compartments, Business
# + Relax), A100 = Ampz 18-95 (ex-ABmoz body: 6 narrow + 4 wide windows), AB000 = ABmz
# 30-90 (Standard, same body as A100), Bk000 = Bmz 21-91 / 28-91 (11 compartments,
# Standard + kids' compartment), Bk100 = Bmz 21-90.0 (ÖBB's own Z1, folding doors,
# LED display). Several Ampz 18-91 and most Bmz 28-91 are only foil-wrapped and still
# show the red ÖBB roof (livery zlutacervenastrecha, vagonWEB "-cs-" drawings).
# RJ car codes are used as vehicle ids (they are painted on every car and used in RJ
# consist lists); display_id is the UIC type.

agency: RegioJet
type: "OBB"
copyright: vojtechzicha      # original art, drawn from scratch
windows_lit_when_loaded: true

display:
  agency_en: "RegioJet"
  agency_cs: "RegioJet"
  family_en: "ex-ÖBB"
  family_cs: "ex-ÖBB"

