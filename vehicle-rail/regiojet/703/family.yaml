  family_cs: "TS Martin T 212.1"

# RegioJet 703.602 (EVN CZ-RJ 98 54 4 703 602-3, until 2022 SK-RJ 92 56 1
# 703 602-3), TS Martin T 212.1, works no. 431-0102, built 1976. With RegioJet
# since 2013 (month not recorded): depot shunter at Praha-Smíchov, from 12/2023
# at Praha-Dolní Měcholupy; hired to Dyko Kolín from 2019, overhauled and back
# 2/2023. Still in service in September 2026, so no retirement date (sources:
# seznam-autobusu.cz vehicle 105877, research/traction.md §1a / §2.6).
#
# Real loco: 7,220 mm over buffers, 24 t, two axles (B), Tatra 930-54 diesel
# 169 kW with ČKD-SRM hydraulic transmission, 40 km/h. Narrow engine hood in
# front of a full-width cab at one end (cab entered from the rear platform),
# deep frame, two lamps at each end plus one on the hood / cab roof.
#
# Livery (the only one it has worn with RJ): cervenobila, the T 212.1 scheme -
# dark red body (photos #802E3A shaded .. #AE606E lit, drawn #A23244) with a
# thin white waist stripe wrapping round hood and cab, bluish-grey frame with a
# white "|| REGIOJET" on its side, red/white warning chevrons on the buffer
# beams (photos: Commons "RegioJet 703 602-3", Sächsische IV K, 2024;
# "703 602 Smichov", Rainerhaufe, 2017).
#
# Sprites: drawn from scratch with the pak128.cs-calibrated box renderer,
# tools/railrender/rj_shunters.py (regenerate: python
# tools/railrender/rj_shunters.py 703). Length 4 (7.22 m at 26.4 m = 13 cu);
# hood leading, cab at the rear, headlights at both ends.

