# RegioJet ex-DB coaches. Original art drawn from scratch: box models from the
# vagonWEB scale side drawings (10 px = 1 m), rendered by tools/railrender/rjcoach.py
# (regenerate with `python tools/railrender/regiojet.py db`), 26.4 m = length 13.
# Livery: Patrik Kotas 2011, RAL 1028 melon yellow + anthracite window band + silver
# doors, red/navy "|| REGIOJET" logo. Sources: vagonWEB RJ fleet description (Sep 2026),
# cs.wikipedia (Vůz Ampz/ABmz/Amz/Bmz RJ), rj.macoslav.cz.
# Ex-DB IC day coaches (dark roof down to the thin yellow cantrail line). Am500 = Avmz
# 19-91 (DB Avümz 111 TEE compartment car, R8 car 2 and the Košice-Čop night portion),
# Ak100 = Avmmz 19-91 (DB 106.1, Eurofima body, windows with mullions, kitchenette),
# Bm100 / Ap100 = Bmpz 28-90 (DB Apmz 121/125: 16 narrow windows, folding doors; Low
# cost, or rebuilt 2024-26 as Relax), Ap200 = Apmmz 18-90 (DB 126.1, wide end windows),
# Bp200 = Bpmz 20-91 (DB 294.3 open 2nd class, 9 wide + 2x2 small windows), Bp200.9 =
# the R8 reinforcement car with 18 bike places, Bp100 = Bpmbz 29-91 (wheelchair version,
# pictogram on the door), Bp500 = Bpmmz 20-91 (DB 284.5, fresh 2026 repaints with a
# light roof and skirt).
# RJ car codes are used as vehicle ids (they are painted on every car and used in RJ
# consist lists); display_id is the UIC type.

