# RegioJet ex-DB UIC-X coaches. Original art drawn from scratch: box models from the
# vagonWEB scale side drawings (10 px = 1 m), rendered by tools/railrender/rjcoach.py
# (regenerate with `python tools/railrender/regiojet.py uicx`), 26.4 m = length 13.
# Livery: Patrik Kotas 2011, RAL 1028 melon yellow + anthracite window band + silver
# doors, red/navy "|| REGIOJET" logo. Sources: vagonWEB RJ fleet description (Sep 2026),
# cs.wikipedia (Vůz Ampz/ABmz/Amz/Bmz RJ), rj.macoslav.cz.
# Ex-DB UIC-X couchette bodies (Bcm 243 family, 1960s-70s): round light-grey roof with
# sloping ends, drop-light windows, folding doors. Bc100 = Bcmz 50-91 (modernised
# "Lůžko" couchette, 3-4 per compartment), Bc300 = Bcmz 50-71 (unmodernised, 160 km/h),
# Bc200 = Bcmz 59-90 (ex-Bvcmbz 249 wheelchair couchette, one door inboard), B200 = Bmz
# 29-90 (the same body with seats and the RJ Bistro counter, R8 car 3). Night trains
# Praha-Košice(-Čop) and Praha-Kraków-Przemyśl.
# RJ car codes are used as vehicle ids (they are painted on every car and used in RJ
# consist lists); display_id is the UIC type.

