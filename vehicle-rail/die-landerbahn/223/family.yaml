agency: DieLanderbahn
type: "223"
copyright: vojtechzicha      # original art, rendered from a box model
# Locomotive: no passengers, so the cab glass is plain and never lights up.
windows_lit_when_loaded: false

display:
  agency_en: "Die Länderbahn"
  agency_cs: "Die Länderbahn"
  family_en: "Siemens ER 20 Hercules"
  family_cs: "Siemens ER 20 Hercules"

# Siemens ER 20 "Hercules" (Eurorunner), DB class 223, Die Laenderbahn (DLB,
# Netinera) 223 061 - 072, ex-Vogtlandbahn / Arriva, in the alex scheme. They
# haul the Bavorsky expres (alex, RE 25 / EC Praha - Plzen - Domazlice - Furth
# im Wald - Schwandorf - Regensburg - Muenchen) between Plzen and Schwandorf;
# the Czech leg is Plzen - Domazlice - Ceska Kubice (line 180, not
# electrified). Seen in 2026: 223 065, 068, 069, 071 (vagonWEB), and 063, 066,
# 070, 072 in the photo record in CZ. Diesel-electric Bo'Bo', MTU 16V 4000,
# 2,000 kW, 140 km/h, 80 t; 19.28 m over buffers, 2.87 m wide, 4.26 m high,
# bogie centres 10.36 m (side markings). Drawn at length 10 like the other
# 19 m locomotives (Vectron, pak128.cs 1216 / 1116 / ES64U2).
#
# Livery alex (photos: 223 068 Domazlice side-on, 223 065 "alexa" Plzen 2024,
# 223 070 Plzen front, 223 063 Schwandorf 2024, 223 066 Lindau, 223 067/071/072;
# OeBB 2016 006 side-on for the body): petrol blue; a white "C" band wraps each
# cab (behind the windscreen, over the sides of the raised cab roof dome); white
# rounded machine-room roof shoulder with a silver roof; blue dome tops and
# fronts; blue sill, light-grey band and yellow-orange stripe along the side
# from C band to C band; blue side panels with vertical-slat louvres and a big
# white "= alex"; front with a black windscreen and amber destination display,
# white "= alex", lamps in black housings, black buffer beam and plough. The
# research described the upper side as white - the side-on photos show blue
# side panels with only the roof shoulder white. 223 072's "Griass di Allgaeu"
# advert is not drawn.
#
# Sprites are rendered from a box model, original art, in the 2026-09-26 render
# style (tools/railrender/style.py: dark line under the white roof shoulder and
# the cab domes, no 1-px "= alex" logos, polish post-process):
# tools/railrender/er20.py (regenerate with `python tools/railrender/er20.py`).

