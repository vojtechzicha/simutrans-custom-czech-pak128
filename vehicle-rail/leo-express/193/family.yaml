agency: LeoExpress
type: "193"
copyright: vojtechzicha      # original art, drawn from scratch
# Locomotive: no passengers, so the cab glass is plain and never lights up.
windows_lit_when_loaded: false

display:
  agency_en: "Leo Express"
  agency_cs: "Leo Express"
  family_en: "Siemens Vectron MS"
  family_cs: "Siemens Vectron MS"

# Siemens Vectron MS, Railpool class 193 (EVN 91 80 7193 xxx, D-Rpool), leased
# by Leo Express from April 2026 for its loco-hauled trains (Talgo VI sets,
# ex-DB IC coaches, the Frankfurt couchette service). 18.98 m over buffers,
# 3.01 m wide, 4.25 m high, Bo'Bo', 6.4 MW, 200 km/h, 84-90 t, bogie centres
# 9.5 m. Drawn at length 10 like pak128.cs draws its 19 m locomotives
# (1216, 1116, ES64U2).
#
# Liveries (photos: Railvolution 7193 226 at Hranice/Praha, Commons LE 235 at
# Naumburg, 7193 198 at Ostrava):
# - bilooranzova: only 7193 226 wears Leo Express colours - near-white / pale
#   silver body, orange cab roof caps with a curved band down each cab side,
#   orange cab doors, charcoal front mask, aluminium buffer beams, large dark
#   "leo express" logo with orange dots and slash mid-body.
# - railpool: 7193 197/198/227/228/231/232 run Leo Express trains in Railpool
#   silver-grey with a black front mask and a light-blue band behind cab 2.
#
# Sprites are rendered from a box model (tools/railrender/vectron.py, styled in
# leo.py: no cab side window, which the real Vectron MS lacks), rendered in the 2026-09-26 style (tools/railrender/style.py: dark roof gutter, light
# pantograph arms with a dark head bar, style.polish).
# Regenerate with `python tools/railrender/leo.py 193`.

vehicles:
  - id: "193"
    role_en: "electric locomotive"
    role_cs: "elektrická lokomotiva"
    row: 0
    prev: any
    next: any
    fields:
      cost: 6800000
      payload: 0
      speed: 200
      weight: 88
      runningcost: 210
      fixed_cost: 3100
      intro_year: 2026
      intro_month: 4
      retire_year: 2060
      retire_month: 1
      waytype: track
      engine_type: electric
      power: 6400
      gear: 160
      length: 10
    extended:
      axles: 4

liveries:
  - color: bilooranzova
    name_en: "Leo Express white-orange"
    name_cs: "Leo Express bílo-oranžová"
  - color: railpool
    name_en: "Railpool silver-blue"
    name_cs: "Railpool stříbrno-modrá"
