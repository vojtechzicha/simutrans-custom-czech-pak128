agency: LeoExpress
type: "480"
copyright: vojtechzicha      # original art, drawn from scratch
# no image_offset: the rail default [0, 4] matches the renderer's anchors

# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "Leo Express"
  agency_cs: "Leo Express"
  family_en: "Stadler FLIRT"
  family_cs: "Stadler FLIRT"

# Stadler FLIRT, CZ class 480.001-005 (Leo Express, delivered 2012, first LE
# service Nov 2012; Praha-Ostrava-Krakow/Warszawa, Presov/Kosice). 5-car EMU,
# Bo'2'2'2'2'Bo': powered bogies under both cab ends, Jakobs bogies at the 4
# joints. 3 kV DC, 2,000 kW continuous (2,600 peak), 160 km/h in service,
# 150 t tare, 2,880 mm wide, 4,150 mm high, 90.178 m over couplers.
# 237 seats: Premium 6 + Business 19 (car 1) + Economy 212 (cars 2-5).
# One single-leaf plug door per side in cars 1, 2, 4 and 5; car 3 has none.
# Pantographs on cars 2 and 4 at the ends next to the cab cars; drawn raised on
# car 2 (as in service photos), lowered on car 4. Dual-voltage conversion began
# in July 2026 (480.002); its outside changes are unpublished, so not drawn.
#
# Car lengths (coordinator): 10, 8, 8, 8, 10 carunits = end cars 21.08 m
# coupler -> Jakobs centre, middle cars 16.0 m Jakobs -> Jakobs. The whole unit
# is modelled on one axis and each car row is rendered with its front on the
# Simutrans anchor (car k's front at 0, 10, 18, 26, 34 cu), so the joints meet
# in all 8 views (checked with tools/consist_preview.py).
# Side layout from the Stadler datasheet drawing FREx0711e (63.72 px/m),
# corrected by the G3 broadside photo: both cab cars have 5 windows behind the
# door; car 2 has a blank (catering) panel on one side.
#
# Liveries (all real; sources: cs.wikipedia "Elektricka jednotka 480",
# zdopravy.cz Oct 2023 "novy polep", Wikimedia Commons photos):
#   cernozlata    G1, 2012-2019: gloss black, champagne-gold cantrail band with a
#                 white pinstripe sweeping down on the cab cars to the front, gold
#                 cab hood + roof fairing back to the door, white headlight ring,
#                 yellow skirt, white LEO EXPRESS.
#   cerna         G2, 2019-2023: all black, thin orange door outlines, big orange
#                 outline "leo" on car 3, small white logo behind the cabs.
#   cernooranzova G3, Oct 2023-now: black, orange U-hood around the windscreen,
#                 orange door leaves, white headlight ring, yellow-orange skirt,
#                 large white "leo express" behind the cabs, network map on car 3,
#                 ticket slogans on cars 2 and 4.
#
# Sprites: 1024x640 per livery, one row per car in the order below, drawn from
# scratch with the pak128.cs-calibrated box renderer:
#   tools/railrender/flirt.py  (regenerate: python tools/railrender/leo.py 480)
# Passenger and door glass use the lit-at-night specials; windscreens and cab
# windows are plain colours. Headlights on car A, tail lights on car B.
# Only the complete unit is buildable: A (head) - 2 - 3 - 4 - B (tail).
# Costs scaled from pak128.cs natives (railjet coach, OBB 1216, DB 642).

