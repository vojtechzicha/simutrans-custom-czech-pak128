agency: DPOpava
type: "32Tr"
copyright: vojtechzicha

# Sprites carry their own lane placement (body footprint on the median of
# native pak128.cs 12 m buses), so no extra shift.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "MDPO"
  agency_cs: "MDPO"
  family_en: "Škoda 32Tr SOR"
  family_cs: "Škoda 32Tr SOR"

# Škoda 32Tr on the SOR NS 12 body, MDPO 314-328 (2018-2020). MDPO white-red
# as on the NSG 12: the red roof edge sweeping down the A-pillar, the straight
# red skirt; black mask, white strip, red apron; yellow sleeves on the upper
# pole ends (as on P4T SK1LL3R's sheet).
# Sprite: original box-model render (vojtechzicha): the dpmhk.py Škoda 32Tr
# body on the common SOR base (the DPMHK 32Tr model with its roof equipment and
# poles), painted by tools/busrender/sor_town.py. Regenerate with
# tools/busrender/sor_town.py.
# - 32Tr_battery: 314-323 (2018) carry a Škoda TBS5.1 traction battery
#   (seznam-autobusu "alternativní pohon: baterie") and run as engine_type
#   battery, so they are not tied to the wire; cost / weight / payload deltas
#   as on the DPMHK 30Tr_battery. Same art: the photos of 314 and of 326 (2020,
#   no battery stated) show the same roof cover.

