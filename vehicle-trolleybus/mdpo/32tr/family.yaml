agency: DPOpava
type: "32Tr"
copyright: P4T SK1LL3R

# The source sprites carry the upstream lane placement (their dats use no
# offset), so no extra shift; the default [0, 4] would sink them 4 px.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true

display:
  agency_en: "MDPO"
  agency_cs: "MDPO"
  family_en: "Škoda 32Tr SOR"
  family_cs: "Škoda 32Tr SOR"

# Škoda 32Tr on the SOR NS 12 body, MDPO 314-328 (2018-2020).
# - 32Tr_battery: 314-323 (2018) carry a Škoda TBS5.1 traction battery
#   (seznam-autobusu "alternativní pohon: baterie") and run as engine_type
#   battery, so they are not tied to the wire; cost / weight / payload deltas
#   as on the DPMHK 30Tr_battery. Same art: the photos of 314 and of 326 (2020,
#   no battery stated) show the same roof cover.

