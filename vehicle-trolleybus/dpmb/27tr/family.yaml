# Škoda 27Tr Solaris, 18 m three-axle articulated trolleybus on the Solaris
# Urbino 18 IV body. DPMB runs 40 (3648-3687, delivered 11/2021-2/2023).
# 18.0 m, 16.8 t, 132 total (DPMB), 260 kW, 65 km/h. DPMB white-red on the
# Urbino IV (DPMB drawing tr27.png): white body and roof, black window band
# that runs up to the roof edge over the front half of the front section
# (split by a white diagonal stripe) and over the rear section except next
# to the joint, white belt, red skirt with red wheel-arch panels, poles on
# the front of the rear section; green destination displays (lit).
# Sprite: TommPa9's CZR-Brno-Skoda_27Tr + 27Tr-B (pak128_czr vehicles-bus/
# Brno): glass converted to the lit-window specials, roof lightened, DPMB
# red, the Urbino IV black roof-edge zones and red wheel arches painted in;
# lane placement already on the native median. Sections keep the upstream
# 8 + 8 spacing the art was drawn for (joints checked in all 8 directions).

