# Škoda 32Tr SOR, 12 m two-axle trolleybus on the SOR NS 12 body with an LTO
# traction battery (partial trolleybus). DPMB runs 40 (3311-3350, delivered
# 8/2023-1/2025). 12.0 m, 11.2 t, 75 total (DPMB), 160 kW, 65 km/h. DPMB NS-
# body scheme (DPMB drawing 32tr.png, photos of 3322/3323/3327): white body
# and roof, red skirt, full-length black window band that continues round the
# windscreen as a black cap over the front roof edge, red swoosh from the roof
# edge down the front pillars, white lower front with the red bumper and red
# lower rear; green destination displays (lit). Modelled as a plain electric
# trolleybus (the upstream dat does not mark the battery). Sprite: original
# box-model render (vojtechzicha): the dpmhk.py SOR NS 12 body (as the DPMB
# TNS 12) on the common SOR base, painted by tools/busrender/sor_town.py
# (until 2026-10-28 VTPsim's hand art). Regenerate with
# tools/busrender/sor_town.py.

