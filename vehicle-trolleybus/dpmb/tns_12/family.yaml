# SOR TNS 12, 12 m trolleybus on the SOR NS 12 body, kits assembled by DPMB at
# the Komín depot with Rail Electronics CZ traction gear: 12 cars 3065-3076
# (3065 "Mario" and 3066 "Luigi" from 6/2023, the rest 2024 to 1/2025); 28
# more (battery) kits remain under the framework with no firm date. 3 double
# doors, 35 seats / 104 total (DPMB), 175 kW, 65 km/h, 12.0 t. DPMB white-red
# as on the Brno 32Tr: white body and roof, red skirt, black window band that
# continues up round the windscreen as a black cap over the roof front,
# red-over-white swoosh at the upper front corner; plain white roof pod (no
# battery module, no Škoda branding); green LED destination displays
# and yellow sleeves on the upper pole ends (photos of 3065 and 3068); the
# silver pole tubes are drawn dark for visibility, as on the Brno 32Tr.
# Sprite: original 8-direction render of the NS 12 body (no upstream pixels,
# sized and lane-placed like the native pak128 12 m buses) with trolley poles
# whose tips end on the pak128.cs trolleybus wire of the own lane.

