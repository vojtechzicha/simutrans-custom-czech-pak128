# body (Urbino III front, photos of 3303) with an auxiliary traction battery.
# DPMB runs all 10 (3301-3310, 2018; 3301 first in service 29 Mar 2018).
# 12.0 m, 12.7 t, 80 total (DPMB), 160 kW, 65 km/h. DPMB white-red: white
