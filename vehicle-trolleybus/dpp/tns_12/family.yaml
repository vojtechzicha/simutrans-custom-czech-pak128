# SOR TNS 12, 12 m battery trolleybus on the SOR NS 12 body: 4 cars (511-514)
# built 2022-23 for DSZO Zlín, supplied to DPP as compensation and re-equipped
# with Škoda traction gear; in DPP service from 17 Apr 2026 (lines 51, 52,
# depot Řepy). 3 doors, 80 passengers (DPP), 175 kW, 65 km/h, about 12 t empty
# (not published; DPP's 19 t is the gross weight). PID 2021 scheme like the
# ENS 12: grey, black window band and front cap, red columns over the wheel
# arches carried across the grey roof equipment fairing, black trolley poles.
# Sprite: original 8-direction render of the NS 12 body (no upstream pixels,
# sized and lane-placed like the native pak128 12 m buses) with trolley poles
# whose tips end on the pak128.cs trolleybus wire of the own lane.

