# Skoda-Solaris 24m (unofficially "Skoda 38Tr"; Solaris Trollino 24 = Urbino 24
# IV facelift body, Skoda SJ 11 equipment), 24.70 x 2.55 x 3.50 m bi-articulated
# battery trolleybus, DPP 401-420: 20 cars on the airport line 59 (depot Repy),
# trial runs from 11/2023, regular service from 7 Mar 2024. 3 sections, 4 axles
# (8x4: axles 2 and 3 driven by 2 x 160 kW Skoda ML 3438 K/4), 5 double doors,
# 54 seats / 180 total, 70 km/h, 23.4 t in running order, 60 kWh usable battery
# (11 km off wire). Joints at 10.37 and 17.2 m from the front (Skoda sheet).
# Livery: PID grey-red: light-grey body, black window band up to the light-grey
# roof fairings, black upper front with the grey lower mask carrying the red
# block on the vehicle's left and the black "smile" headlight wedges; a red
# panel round each of the four wheel arches; red bands over the roof fairings
# above axles 1-3 (the rear section's roof carries the black pole rack and no
# red band, photos of 401/413); black rear window area over a grey lower rear
# with the red block and the yellow "extra long vehicle" plate; grey bellows.
# Sprite: new 8-direction box render (8 + 5 + 6 carunit sections at the ENS 12
# / TNS 12 scale), trolley poles aimed at the pak128.cs wire of the own lane.

