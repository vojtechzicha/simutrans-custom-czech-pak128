agency: DPOstrava
type: "36TrSolaris"
# The sprite sits on the footprint of the other DPO trolleybus sheets (it
# carries its own placement), so no extra shift (the default [0, 4] would sink
# it 4 px).
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true
copyright: TommPa9

display:
  agency_en: "DPO"
  agency_cs: "DPO"
  family_en: "Škoda 36Tr"
  family_cs: "Škoda 36Tr"

# Škoda 36Tr with the Temsa body (not Solaris): 18 cars 3741-3758 delivered
# 2023, all with traction batteries for off-wire running. The object ids keep
# the historical "36TrSolaris" token so existing saves still load.
# Sprite: original box-model render (vojtechzicha): the dpmhk.py Temsa Avenue
# Electron body (TM12, since 2026-10-28; until then a patched sheet of its
# own) in sor_town.py's dpo_tm palette: the DPO turquoise with the turquoise
# cap over the cab, the tall black glazing band with the light grey line under
# it, the full-length roof band with the white "ooo" mark, the light grey band
# between the headlamps, turquoise rear corners over the black bumper, black
# poles (transphoto.org 1724715, 1724941, 1770934 and the earlier photos of
# 3742 / 3746 / 3748 / 3758). Regenerate with tools/busrender/sor_town.py.
#
# engine_type=battery models the off-wire capability; in pak128.cs this means
# the vehicle can operate on roads without overhead lines.

vehicles:
  - id: "36TrSolaris"
    role_en: "trolleybus (IMC)"
    role_cs: "parciální trolejbus"
    row: 0
    prev: []
    next: []
    fields:
      cost: 1075000
      payload: 96
      speed: 70
      weight: 16
      runningcost: 19
      fixed_cost: 88
      intro_year: 2023
      intro_month: 1
      retire_year: 2055
      retire_month: 1
      waytype: road
      freight: Passagiere
      length: 8
      engine_type: battery
      power: 175

liveries:
  - color: dpotyrkysova
    name_en: "DPO turquoise"
    name_cs: "DPO tyrkysová"
