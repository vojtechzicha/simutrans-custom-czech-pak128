# Škoda 36Tr Solaris — in-motion-charging (IMC) variant of the 26Tr, with
# onboard traction battery so the trolleybus can detach from the catenary and
# run for a limited range on battery alone. Sprites are reused from 26Tr (same
# Solaris Trollino 12 body). DPO Ostrava began receiving 36Tr units in 2020.
#
# engine_type=battery models the off-wire capability; in pak128.cs this means
# the vehicle can operate on roads without overhead lines.

