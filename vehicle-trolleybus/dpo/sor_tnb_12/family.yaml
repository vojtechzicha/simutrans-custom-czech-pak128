agency: DPOstrava
type: "SOR_TNB_12"
# Sprites carry their own lane placement (body footprint on the median of
# native pak128.cs 12 m buses), so no extra shift.
image_offset: [0, 0]
# Windows light up at night only while passengers are aboard.
windows_lit_when_loaded: true
copyright: vojtechzicha

display:
  agency_en: "DPO"
  agency_cs: "DPO"
  family_en: "SOR TNB 12"
  family_cs: "SOR TNB 12"

# SOR TNB 12, the only one built: the 2009
# prototype (SOR Libchavy body on the NB 12, Cegelec TV Europulse electrics,
# final assembly by DPO). On loan to DPO from 2/2010 as 9997, passenger trials
# from 26 April 2010, type approval 22 December 2010, bought by DPO and
# numbered 3912 from 2/2011. cs.wikipedia lists it as written off between
# October 2025 and January 2026 and then returned to service; seznam-autobusu
# shows it on lines 102, 108 and 109 in October 2026. Classic version without
# a traction battery: engine_type electric (wire only), like the 26Tr.
# 12.18 x 2.55 m, 3.40 m over the poles, 4 double doors, 28 seats + 67
# standing = 95, Pragoimex asynchronous motor 175 kW, 65 km/h, 10.2 t.
# Livery (seznam-autobusu: "bílá s modrou střechou", from new to today): white
# body, black glazing band and front mask, light blue cant rail and front cap
# (variant B, picked 2026-10-10: the roof itself stays white); light grey
# poles with a dark base (photos of 3912). The gold swirl and the "SOR
# Trolejbus" lettering are not drawn.
# Sprite: original box-model render (vojtechzicha): the dpmhk.py Škoda 30Tr
# body on the common SOR base (the SOR NB 12 trolleybus body with its roof
# equipment and poles), painted by tools/busrender/sor_town.py. Regenerate with
# tools/busrender/sor_town.py.
# Economy like the 26Tr (same motor), a little cheaper as an old prototype.

vehicles:
  - id: "SOR_TNB_12"
    role_en: "trolleybus"
    role_cs: "trolejbus"
    row: 0
