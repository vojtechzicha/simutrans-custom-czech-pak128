# Škoda 33Tr SOR, 18.75 m articulated partial trolleybus on the SOR NS 18
# body: DPMHK 51-54, delivered 9/2026, in passenger service from October 2026.
# Traction battery for ~10 km off the wire, 65 km/h, drive on the rear axle
# (pusher; 240 kW), 4 double doors (front, middle of the front section, behind
# the joint, behind the rear axle), ~44 seated + ~86 standing (type data).
# Livery: the new 2026 DPMHK design: black front mask and roof cap, red chin
# with the crowned G, red outline strips up the A-pillars; front section red
# (roof fairing and lower body) under the black window band, a vertical yellow
# stripe just ahead of the middle-axle arch (press photos of 51 and 54), white
# behind it and on the whole rear section; a big white G under a yellow crown
# on the window band ahead of the stripe.
# Sprite: new 8-direction box render (8 + 6 carunit sections at the TNS 18
# scale, joint at the real 11.1 m), poles on the front section above the
# middle door (press photos), aimed at the pak128.cs wire of the own lane.

