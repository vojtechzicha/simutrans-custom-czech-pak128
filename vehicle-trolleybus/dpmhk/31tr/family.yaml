# Škoda 31Tr SOR, 18.75 m articulated trolleybus on the SOR TNB 18 (NB 18
# City) body: DPMHK 61-73 (2010-2013; 61 is the prototype), all 13 in service
# in Sep 2026. Škoda 2ML 3846 K/6 250 kW driving the rear axle (pusher),
# 65 km/h, ~15.8 t, 46 seated + 115 standing. Long front section (~12.3 m,
# 3 doors), short rear section (2 doors, the last behind the rear axle).
# Livery: DPMHK classic red-yellow-white, as on the 30Tr (white front and roof,
# black window band, yellow band over red, white panel and yellow/red
# diagonals on the left front corner). 63 and 66 carry full-body adverts.
# Sprite: new 8-direction box render, 9 + 5 carunit sections matching the real
# joint position; AC unit at the front of the roof, equipment fairing ahead of
# the joint, poles on the front of the rear section with the silver retriever
# rack behind them, aimed at the pak128.cs wire of the vehicle's own lane.

