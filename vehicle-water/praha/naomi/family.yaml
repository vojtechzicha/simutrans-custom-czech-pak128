# Real vehicle: Naomi-type ferry boats of Pražské Benátky (design Zdeněk
# Bergman), three built for the PID ferries P1 Sedlec - Zámky (Břehule),
# P5 Císařská louka - Výtoň (Břehouš) and P6 Lahovičky - Nádraží Modřany
# (Ledňáček), first in service 20 Sep 2016. 8.5 x 3.15 m, draught 44 cm,
# 22 kW diesel, 12 passengers + bikes (prazskebenatky.cz, převozní lodě).
# Livery: near-black hull with white name and number, red deck and gunwale,
# bottle-green flat canopy with a scalloped valance on thin black posts, low
# black railings, varnished wheelhouse (arched windows, cream top band) at
# 62-83 % of the length towards the bow, red-white lifebuoys, radar/lamp mast,
# Czech flag at the stern (photos img/c34c Břehule side, c01 three boats bow-on,
# c20 Lahovičky).
# Sprite: original box render, tools/shiprender/praha_ferries.py (boatkit.py
# on tools/busrender/render.py) at its true size on the render.py road scale
# (8.5 m = 36 px in the side views, next to 51 px for a 12 m bus and 47 px for
# the Kazi), in the bold detail the user picked: a plain deep canopy valance,
# a light canopy outline and the top railing only. Hull centre on the water lane of
# the native Ferry_yeu_128set / Veveri_ship_128set.

