# Real vehicle: Baba, a Kazi-type ferry boat of Pražské Benátky (design
# Zdeněk Bergman, after the Vltava "naháč" salt boat), built 2016 for the PID
# ferry P2 V Podbabě - Podhoří, first in service 12 Jul 2016. 11.2 x 3.7 m,
# draught 50 cm, 43 kW diesel, 40 passengers + bikes, step-free
# (prazskebenatky.cz, převozní lodě).
# Livery: the Naomi scheme on the longer hull: near-black hull with white BABA
# and PVČS 112 609, red deck, long bottle-green canopy with a scalloped
# valance, varnished wheelhouse near the bow (15-27 % from the bow), raked and
# raised bow, benches and tables aft, Czech flag at the stern (photos img/c33c,
# c35, c30).
# Sprite: original box render, tools/shiprender/praha_ferries.py (boatkit.py
# on tools/busrender/render.py) at its true size on the render.py road scale
# (11.2 m = 47 px in the side views, next to 51 px for a 12 m bus), scalloped
# canopy valance and two railings. Hull centre on the water lane of the
# native Ferry_yeu_128set / Veveri_ship_128set.

